<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0;font-size:14px}*,*::before,*::after{box-sizing:border-box}img{max-width:100%}[hidden]{display:none!important}</style>
<title>철탑 3D 뷰어</title>
<meta name="theme-color" content="#1b2226">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed 3D terrain with one straight line at a time; line summary top-left, detail card right (bottom on phones), line picker + tower rail along the bottom */
:root{
  --sky:#dbe3e6;
  --surface:rgba(250,251,250,.95);
  --ink:#1b2226;
  --muted:#59666c;
  --line:#c4ced2;
  --accent:#dd6a17;
  --accent-ink:#ffffff;
  --steel:#3a4247;
  --wire:#1f6fb8;
  --road:#4a4f52;
  --water:#3f8fc2;
  --river:#2a6fd6;
  --railc:#7a4fb5;
  --urban:#b0762a;
  --paddy:#5e9a2e;
  --field:#9a7b3c;
  --kudzu:#2f6b23;
  --danger:#c43a3a;
  --card:#ffffff;
  --soft:#e3e9ec;
  --ok:#1f8a4c;
  --ui:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#0f1518; --surface:rgba(21,28,32,.95); --ink:#e3e9eb; --muted:#91a0a6; --line:#2c383d;
    --accent:#f08a3a; --accent-ink:#1a1006; --steel:#b1bbc0; --wire:#6fb4f0; --road:#55595c; --water:#4aa3d8; --river:#5b9cf5; --railc:#a983e0; --urban:#d79a4a; --paddy:#7fbf4a; --field:#c4a160; --kudzu:#4f9a3a; --danger:#ef6b6b; --card:#182126; --soft:#26333a; --ok:#3fb36f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky:#0f1518; --surface:rgba(21,28,32,.95); --ink:#e3e9eb; --muted:#91a0a6; --line:#2c383d;
  --accent:#f08a3a; --accent-ink:#1a1006; --steel:#b1bbc0; --wire:#6fb4f0; --road:#55595c; --water:#4aa3d8; --river:#5b9cf5; --railc:#a983e0; --urban:#d79a4a; --paddy:#7fbf4a; --field:#c4a160; --kudzu:#4f9a3a; --danger:#ef6b6b; --card:#182126; --soft:#26333a; --ok:#3fb36f; color-scheme:dark;
}
[hidden]{display:none !important}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden}
#scene{position:absolute;inset:0;touch-action:none}
#scene canvas{display:block;width:100%;height:100%}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
button,input,select{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tag{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;display:inline-flex;align-items:center;gap:4px;will-change:transform;
  font:600 11px/1 var(--mono);font-variant-numeric:tabular-nums;padding:3px 6px;
  background:var(--surface);color:var(--ink);border:1px solid var(--line);white-space:nowrap;border-radius:99px}
.tag.ten{border-radius:2px;border:1.5px solid var(--ink)}
.tag.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag.danger-tag{border-color:var(--danger);box-shadow:0 0 0 1.5px var(--danger)}
.tag.danger-tag.on{background:var(--danger);color:#fff;border-color:var(--danger)}
.tag .warn{font-style:normal;font-size:11px;line-height:1}
.danger-check{border:1px solid var(--danger);border-radius:8px;padding:8px 10px;margin-top:6px}
.xtag{position:absolute;left:0;top:0;pointer-events:none;font:600 10.5px/1 var(--ui);padding:4px 7px;border-radius:4px;color:#fff;white-space:nowrap;will-change:transform}
.xtag.road{background:var(--road);border:1px solid rgba(255,255,255,.35)}
.xtag.river{background:var(--river)}
.xtag.xrail{background:var(--railc)}
.ground{position:absolute;left:0;top:0;pointer-events:none;font:600 10.5px/1 var(--ui);padding:3px 7px;border-radius:99px;color:#fff;white-space:nowrap;will-change:transform;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.xtag.valley{background:var(--water)}
.xtag.ball{background:#e2581b}
.qty{display:flex;align-items:center;gap:8px}
.arrrow{display:flex;align-items:center;gap:8px;margin-top:6px}
.arrrow>.lb{min-width:64px;white-space:nowrap}
.arrrow .seg{flex:1}
.arrrow .seg button{padding-left:4px;padding-right:4px;font-size:12px}
.qty .stepper,.qty .seg{flex:1}
.lampbox{display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px}
.ldot{display:inline-block;width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 1px var(--line);margin-right:5px;vertical-align:-1px}
.lamplist{display:flex;flex-wrap:wrap;gap:6px}
.lampchip{display:inline-flex;align-items:center;flex-wrap:wrap;font-size:12.5px;font-weight:600;padding:5px 9px;border-radius:6px;background:color-mix(in srgb,var(--ink) 7%,transparent)}
.lampchip small{font-weight:400;color:var(--muted);margin-left:6px}
.lamps{display:grid;gap:6px}
.lamps[aria-disabled="true"]{opacity:.45;pointer-events:none}
.lamprow{display:grid;grid-template-columns:1fr 92px;align-items:center;gap:8px}
.lamprow>span{display:flex;align-items:center;gap:6px;font-size:13px;flex-wrap:wrap}
.lamprow>span i{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.lamprow small{font-size:11px;color:var(--muted);width:100%;padding-left:16px}
.lamprow input{padding:7px 30px 7px 10px !important;font-size:14px}
.qty[aria-disabled="true"]{opacity:.45;pointer-events:none}
.sym{display:inline-block;width:8px;height:8px;flex:0 0 auto}
.sym.sus{border-radius:50%;border:1.5px solid currentColor}
.sym.ten{background:currentColor}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.head{position:absolute;top:12px;left:max(16px, env(safe-area-inset-left,0px));max-width:min(330px, calc(100% - 32px));padding:12px 14px;display:grid;gap:5px}
.eyebrow{font:600 10px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.head h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.stats .pk{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;border-radius:4px;padding:1px 2px}
.stats .pk.on{background:var(--accent);color:var(--accent-ink);text-decoration:none}
.stats .pklist{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px;max-height:96px;overflow:auto;white-space:normal}
.stats .pklist b{font-family:var(--ui);font-size:11.5px;margin-right:2px}
.stats .pklist button{font:600 12px/1 var(--ui);padding:6px 9px;border-radius:99px;border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer}
.stats .pklist button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.head .stats{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;line-height:1.5;white-space:pre-line}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .sw{width:12px;height:8px;border-radius:2px}

.card{position:absolute;top:12px;right:max(16px, env(safe-area-inset-right,0px));width:300px;padding:14px;display:grid;gap:11px;max-height:calc(100% - 190px);overflow:auto}
.card-top{display:flex;align-items:center;gap:8px;min-width:0}
.card-top .no{font:600 22px/1 var(--mono)}
.card-top h2{margin:0;font-size:15px;font-weight:700;line-height:1.3;min-width:0}
.sub{font-size:12px;color:var(--muted);margin-top:-6px}
.pill{font-size:11px;font-weight:600;padding:3px 8px;border:1.5px solid var(--line);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;border-radius:99px}
.pill.ten{border-color:var(--ink);color:var(--ink);border-radius:3px}
.close{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:6px}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px}
.card dt{color:var(--muted)}
.card dd{margin:0;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.field{display:grid;gap:6px;min-width:0}
.lb,.field>label{font-size:11.5px;color:var(--muted)}
.field input[type=text],.field input[type=number]{font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
.field input[type=number]{font-family:var(--mono)}
.unit{position:relative}
.unit input{padding-right:34px !important}
.unit::after{content:attr(data-unit);position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);padding:7px 8px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sky);font-weight:600}
.kvq{display:flex;gap:4px;flex-wrap:wrap}
.kvq button{font:500 12px/1 var(--mono);padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.kvq button[aria-pressed="true"]{background:var(--ink);color:var(--sky);border-color:var(--ink)}
.checks{display:grid;gap:6px}
.check{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink)}
.check input{width:18px;height:18px;margin:0;accent-color:var(--accent);flex:0 0 auto}
.check .sw{width:12px;height:8px;border-radius:2px;margin-left:auto;flex:0 0 auto}
.primary{border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:13px;padding:10px 12px;cursor:pointer}
.ghost{border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font-size:12.5px;padding:9px 10px;cursor:pointer}
.danger{color:var(--danger);border-color:var(--danger)}
.err{margin:0;font-size:12px;color:var(--danger)}
.note{font-size:11.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;line-height:1.45;margin:0}
.actions{display:grid;gap:6px}
.sync{justify-self:start;font:600 10.5px/1 var(--ui);padding:4px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.sync.ok{color:#1f8a4c;border-color:#1f8a4c}
.sync.busy{color:var(--muted)}
.sync.err{color:var(--danger);border-color:var(--danger)}
.login{position:fixed;inset:0;z-index:50;background:var(--sky);display:grid;place-items:center;overflow:auto;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:24px}
.login-card{width:min(380px,100%);padding:18px;display:grid;gap:12px}
.login-card h2{margin:0;font-size:18px;font-weight:700}
.field input[type=email],.field input[type=password]{font-size:15px;padding:10px 11px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
.field textarea{font:12px/1.4 var(--mono);padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);resize:vertical;min-width:0;width:100%;box-sizing:border-box;word-break:break-all}

.rail{position:absolute;left:0;right:0;bottom:0;display:grid;gap:8px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:0 calc(12px + env(safe-area-inset-bottom,0px))}
.tools{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;align-items:center}
.tools::-webkit-scrollbar{display:none}
.tools select{font-size:13px;font-weight:600;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:56vw;flex:0 1 auto}
.btn{font-size:12.5px;padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;flex:0 0 auto}
.btn[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
.chips{display:flex;gap:4px;overflow-x:auto;padding:6px;scrollbar-width:thin}
.chip{flex:0 0 auto;display:grid;gap:4px;text-align:left;padding:7px 10px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--ink);cursor:pointer}
.chip b{font:600 13px/1 var(--mono);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip span{font:500 10.5px/1 var(--mono);color:var(--muted);white-space:nowrap;display:flex;gap:4px;align-items:center}
.chip span i{width:8px;height:6px;border-radius:1px;display:inline-block}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chip.on span{color:var(--accent-ink)}

.playbar{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:10px;padding:8px 10px}
.playbar .ic{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font-size:14px;display:grid;place-items:center}
.playbar .ic.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pinfo{min-width:0;display:grid;gap:5px}
.pinfo .t{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo .t span{font-family:var(--mono);font-weight:500;color:var(--muted)}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.speed{font:600 12px/1 var(--mono);padding:8px 9px}

.ledger{position:fixed;inset:0;z-index:40;background:var(--sky);overflow:auto;-webkit-overflow-scrolling:touch}
.lg-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.lg-head{display:grid;gap:2px;min-width:0}
.lg-head b{font-size:16px}
.lg-head span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-body{max-width:640px;margin:0 auto;display:grid;gap:12px;padding-block:14px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.lg-prog{padding:12px;display:grid;gap:8px}
.lg-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font:600 13px/1.3 var(--ui)}
.lg-prog .bar{height:6px}
.lg-prog .bar i{background:var(--ok)}
.lg-diagram{padding:12px;display:grid;gap:10px}
.lg-picks{display:flex;flex-wrap:wrap;gap:6px}
.lg-grid{display:grid;gap:10px}
.photo-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;min-width:0}
.photo-label{font-weight:700;font-size:15px}
.photo-preview{width:100%;aspect-ratio:4/3;max-width:100%;background:var(--soft);border-radius:8px;display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:13px}
.photo-preview img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.upload-btn{width:100%;padding:11px 8px;border:1px dashed var(--muted);border-radius:8px;background:transparent;color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer}
.group-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.group-head b{font-size:16px}
.group-head small{color:var(--muted);font-size:12.5px}
.side{display:grid;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.side-head{font-size:13px;font-weight:600}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.thumbs:empty{display:none}
.thumb{position:relative;aspect-ratio:1;max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:6px;cursor:zoom-in}
.thumb-x{position:absolute;top:3px;right:3px;border:0;border-radius:50%;width:26px;height:26px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:0;cursor:pointer}
.lg-input{width:100%;font-size:14px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:16px}
.lightbox img{max-width:100%;max-height:88vh;object-fit:contain}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:80;margin:0 auto;max-width:420px;background:var(--ink);color:var(--sky);border-radius:10px;padding:12px 14px;text-align:center;font-size:13.5px}
.lg-modal{position:fixed;inset:0;z-index:75;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:20px}
.lg-modal-box{width:min(360px,100%);padding:16px;display:grid;gap:8px}
.lg-modal-box p{margin:0 0 4px;font-weight:600;overflow-wrap:anywhere}
.lg-danger{background:var(--danger)}
.ledger-btn{font-size:14px;padding:11px 12px}
.hot:focus-visible{outline:2px solid var(--accent)}
/* 순서대로 한번에 첨부 */
.sq-modal{max-height:82vh;overflow:auto}
.sq-list{display:grid;gap:4px;margin:4px 0}
.sq-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-weight:400}
.sq-row input{width:18px;height:18px;margin:0;accent-color:var(--accent);flex:0 0 auto}
.sq-row.off{opacity:.5}
.seq-open{width:100%;font-size:15px;padding:13px 12px}
.seq-mini{width:100%;font-size:13.5px;padding:11px 8px;border-radius:8px}
@media (max-width:640px){
  .head{padding:10px 12px}
  .head h1{font-size:16px}
  .head .legend{display:none}
  .card{top:auto;bottom:calc(var(--railH, 120px) + 8px);left:max(16px, env(safe-area-inset-left,0px));right:max(16px, env(safe-area-inset-right,0px));width:auto;max-height:50%}
  .card dl{grid-template-columns:auto 1fr auto 1fr}
  body.playing .card{display:none}
}
/* v10: 화면 분할 — 철탑을 누르면 3D(위/왼쪽)와 정보 카드(아래/오른쪽)가 겹치지 않게 나뉨 */
.splitBtn{font-size:13px;padding:5px 8px;border-radius:7px;white-space:nowrap;margin-left:auto}
.splitBtn[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.card-top .splitBtn + .close{margin-left:0}
body.split #scene,body.split #labels{right:var(--splitR,0px);bottom:var(--splitB,0px)}
body.split #scene{border-bottom:2px solid var(--accent)}
body.split .card{top:var(--splitT,auto);max-height:none;bottom:calc(var(--railH, 120px) + 8px)}
@media (max-width:640px){
  body.split{--splitB:calc(100% - 46%)}
  body.split .head p.stats,body.split .head .eyebrow{display:none}
  body.split .card{--splitT:calc(46% + 8px)}
}
@media (min-width:641px){
  body.split{--splitR:330px}
  body.split .card{--splitT:12px}
}
</style>

</head>
<body>
<div class="ledger" id="ledger" hidden>

<script>
(function(){

function normalize(l){l.towers.forEach(d=>{if(!d.id)d.id=rid();if(d.angDir==null)d.angDir='';if(d.angDeg==null)d.angDeg=0;if(d.dmpGW>0&&d.dmpGWS==null)d.dmpGWS=d.dmpGW;if(d.dmpOP>0&&d.dmpOPS==null)d.dmpOPS=d.dmpOP;delete d.dmpGW;delete d.dmpOP;if(d.danger==null)d.danger=false;d.label=String(d.label);if(d.kudzu==null)d.kudzu=false;if(d.land==null)d.land=d.urban?'urban':d.paddy?'paddy':'';delete d.urban;delete d.paddy;if(d.form==null)d.form='';if(d.ball==null)d.ball=false;if(d.ballN==null)d.ballN=0;if(d.ball1R==null&&d.ball1W==null&&d.ball2R==null&&d.ball2W==null){const r=d.ballR!=null?d.ballR:Math.ceil((d.ballN||0)/2),w=d.ballW!=null?d.ballW:Math.floor((d.ballN||0)/2);d.ball1R=r;d.ball1W=w;d.ball2R=0;d.ball2W=0;}['ball1R','ball1W','ball2R','ball2W'].forEach(k=>{if(d[k]==null)d[k]=0;});d.ballN=d.ball1R+d.ball1W+d.ball2R+d.ball2W;delete d.ballR;delete d.ballW;if(d.lamp===undefined)d.lamp=null;if(d.lamp==null)d.lampN=null;else if(!d.lampN)d.lampN=d.lampKind==='high'?{high:1,mid:0,low:0}:null;});l.name=stripTL(l.name);if(!KV_QUICK.includes(l.kv))l.kv=KV_QUICK.reduce((a,b)=>Math.abs(b-l.kv)<Math.abs(a-l.kv)?b:a);if(![2,4,6].includes(l.circuits))l.circuits=2;if(![1,2].includes(l.gw))l.gw=defGW(l.kv);if(!WT.includes(l.gw1))l.gw1='GW';if(!WT.includes(l.gw2))l.gw2='OPGW';if(!l.seed)l.seed=Math.round(Math.random()*90)+4;return l;}
lines.forEach(normalize);

/* ---------- 저장 (Supabase 서버 · 로그인 없이 주소만 알면 같이 씀) ---------- */
const SUPABASE_URL="https://cyctshvdqhgdglkdehba.supabase.co";
const SUPABASE_KEY="sb_publishable_AyUXHnUPDy26XSHCINLZJg_h9EKL6Dx";

let DB=null, AS=null, DL=true, serverHash={}, serverStamp={}, flushT=null, flushing=false, again=false, cloudReady=false, pulling=false;

function save(){

const isDirty=id=>{const l=lines.find(x=>x.id===id);return !!l&&JSON.stringify(l)!==serverHash[id];};
async function flush(){
  if(!sb||!cloudReady) return;
  if(flushing){again=true;return;}
  flushing=true; clearTimeout(flushT); flushT=null;
  try{
    const now={}; lines.forEach(l=>now[l.id]=JSON.stringify(l));
    const up=lines.filter(l=>now[l.id]!==serverHash[l.id]).map(l=>({id:l.id,data:JSON.parse(now[l.id]),updated_by:CLIENT}));
    const gone=Object.keys(serverHash).filter(id=>!(id in now));
    if(up.length){
      const {data,error}=await sb.from(T_LINES).upsert(up).select('id,updated_at');
      if(error) throw error;
      up.forEach(r=>{serverHash[r.id]=now[r.id];});
      (data||[]).forEach(r=>{serverStamp[r.id]=r.updated_at;});
    }
    if(gone.length){
      const {error}=await sb.from(T_LINES).delete().in('id',gone);
      if(error) throw error;
      gone.forEach(id=>{delete serverHash[id];delete serverStamp[id];});
    }
    writeCache(); syncState('ok','저장됨 · 공유 중');
  }catch(e){
    console.error(e); syncState('err','저장 실패 · 다시 시도 중'); clearTimeout(flushT); flushT=setTimeout(flush,10000);
  }finally{
    flushing=false; if(again){again=false;flush();}
  }
}

// 다른 사람이 고친 내용 가져오기 (10초마다, 화면으로 돌아올 때)
async function pull(){
  if(!sb||!cloudReady||pulling||flushing||flushT) return;
  pulling=true;
  try{
    const {data,error}=await sb.from(T_LINES).select('id,updated_at');
    if(error) throw error;
    const ids=new Set(data.map(r=>r.id));
    const changed=data.filter(r=>serverStamp[r.id]!==r.updated_at).map(r=>r.id);
    const removed=Object.keys(serverStamp).filter(id=>!ids.has(id));
    let touchCur=false, touched=false;
    for(let i=0;i<changed.length;i+=40){
      const {data:rows,error:e2}=await sb.from(T_LINES).select('id,data,updated_at').in('id',changed.slice(i,i+40));
      if(e2) throw e2;
      rows.forEach(r=>{
        if(isDirty(r.id)&&serverHash[r.id]!==undefined){serverStamp[r.id]=r.updated_at;return;}
        const d=normalize(r.data); d.id=r.id;
        serverHash[r.id]=JSON.stringify(d); serverStamp[r.id]=r.updated_at;
        const ix=lines.findIndex(l=>l.id===r.id);
        if(ix>=0) lines[ix]=d; else lines.push(d);
        if(r.id===curId) touchCur=true; touched=true;
      });
    }
    removed.forEach(id=>{
      delete serverStamp[id]; delete serverHash[id];
      const n=lines.length; lines=lines.filter(l=>l.id!==id);
      if(lines.length!==n){touched=true; if(id===curId) touchCur=true;}
    });
    if(!lines.length){lines=[{id:'l'+rid(),name:'새 선로',kv:154,circuits:2,seed:7,towers:range(1,10)}];save();}
    if(!lines.find(l=>l.id===curId)){curId=lines[0].id;selT=null;card.hidden=true;touchCur=true;}
    writeCache();
    if(touchCur) rebuildSoon(); else if(touched) renderHead();
    await pullPhotos();
    if(!flushT&&!flushing){const d=new Date();syncState('ok','공유 중 · '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')+' 확인');}
  }catch(e){console.error(e);syncState('err','연결 끊김 · 다시 시도 중');}
  finally{pulling=false;}
}
async function pullPhotos(force){
  const {data,error}=await sb.from(T_PHOTOS).select('id,data,updated_at').order('id').range(0,9999);

  photoStamp=stamp;

function hash(i,j){const s=Math.sin(i*127.1+j*311.7)*43758.5453;return s-Math.floor(s);}
function noise(x,y){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j;const u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  const a=hash(i,j),b=hash(i+1,j),c=hash(i,j+1),d=hash(i+1,j+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}

}

function fitting(a,b,kind,H){
  if(!kind) return;

  const up=new T.Vector3(0,1,0); let p=new T.Vector3().crossVectors(d,up); if(p.lengthSq()<1e-4) p.set(1,0,0); p.normalize();
  if(kind==='아킹혼'){
    const h=Math.max(.5,H*.012);
    const a1=A.clone().addScaledVector(p,h).addScaledVector(d,h*.8), b1=B.clone().addScaledVector(p,h).addScaledVector(d,-h*.8);
    EXTRA.horns.push(A.x,A.y,A.z,a1.x,a1.y,a1.z, B.x,B.y,B.z,b1.x,b1.y,b1.z);
  }else if(kind==='아킹링'){
    EXTRA.rings.push({p:B.clone().addScaledVector(d,-Math.min(.4,len*.15)),d:d.clone(),r:Math.max(.3,H*.009)});
  }else if(kind==='피뢰기'){
    const o=Math.max(.6,H*.014);

  }
}
// 회선 번호: 선로 진행 방향 왼쪽(s=+1)·오른쪽(s=-1) 중 #1 쪽은 선로 정보의 '#1 측' 설정을 따름
const noOf=(l,s)=>(s===(l.side1==='right'?-1:1))?'1':'2';
function hangIns(l,t,W,seg,steel,s,x,hy,hang,ins,key,att){
  const H=t.H, kv=l.kv, no=noOf(l,s), kS=t.d['arr'+no+'S']||'', kL=t.d['arr'+no+'L']||'';
  if(t.tension){

const DMP_G=[{k:'dmpP',name:'전력선',keys:['dmpP']},{k:'dmpGW',name:'GW',keys:['dmpGWS','dmpGWL']},{k:'dmpOP',name:'OPGW',keys:['dmpOPS','dmpOPL']}];

host.addEventListener('pointerdown',()=>{if((backupMode||addMode)&&!card.hidden) closeCard();});
/* ---------- 선택 / 카메라 ---------- */
const marker=new T.Mesh(new T.RingGeometry(16,21,48),new T.MeshBasicMaterial({color:0xdd6a17,side:T.DoubleSide,depthTest:false,transparent:true}));
marker.rotation.x=-Math.PI/2; marker.visible=false; marker.renderOrder=5; scene.add(marker);
// 선택한 철탑을 가까이 볼 때: 번호찰·위험표시찰·수직구명줄·등반방지장치
let detailGrp=null;
function plateTex(lines,bg,fg,border){
  const c=document.createElement('canvas'); c.width=256; c.height=160; const x=c.getContext('2d');
  x.fillStyle=bg; x.fillRect(0,0,256,160); x.lineWidth=10; x.strokeStyle=border; x.strokeRect(5,5,246,150);
  x.fillStyle=fg; x.textAlign='center'; x.textBaseline='middle';
  x.font='bold 64px sans-serif'; x.fillText(lines[0],128,lines[1]?66:82);
  if(lines[1]){x.font='bold 24px sans-serif'; x.fillText(lines[1],128,124);}
  const tx=new T.CanvasTexture(c); tx.anisotropy=4; return tx;
}
function updateDetail(){
  if(detailGrp){scene.remove(detailGrp);detailGrp.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){if(o.material.map)o.material.map.dispose();o.material.dispose();}});detailGrp=null;}
  const t=selT; if(!t||!t.W) return;
  const g=new T.Group(), W=t.W;
  const face=y=>t.pole?(t.poleR(y)+.08):(t.widthAt(y)/2+.08);    // 카메라 쪽 면까지 거리
  const plate=(tex,w,h,y)=>{const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:tex,side:T.DoubleSide}));const p=W([-face(y),y,0]);m.position.set(p[0],p[1],p[2]);m.rotation.y=-(t.th||0);g.add(m);};
  const l=cur();
  plate(plateTex([t.label+'호',stripTL(l.name)],'#ffffff','#111111','#1f4fa0'),1.7,1.06,4.4);
  if(t.d.danger) plate(plateTex(['⚠ 위험','고압 전기 · 접근 금지'],'#ffd400','#c00000','#c00000'),1.5,.94,3.0);
  const line=(pts,color)=>{const gg=new T.BufferGeometry();gg.setAttribute('position',new T.Float32BufferAttribute(pts,3));g.add(new T.LineSegments(gg,new T.LineBasicMaterial({color})));};
  // 수직구명줄: 전원측 다리(A각)를 따라 주황색 줄
  const lp=[], top=t.H*.93, N=40;
  for(let k=0;k<N;k++){const y1=.6+(top-.6)*k/N, y2=.6+(top-.6)*(k+1)/N;
    const at=y=>{if(t.pole){const r=t.poleR(y)+.25;return W([-r*.7,y,-r*.7]);}const c=t.corner(0,y);return W([c[0]-.3,y,c[2]-.3]);};
    lp.push(...at(y1),...at(y2));}
  line(lp,0xff7a00);
  // 등반방지장치: 다리 높이 3.5m 둘레
  const ap=[];
  [3.3,3.8].forEach(y=>{
    if(t.pole){const r=t.poleR(y)+.3;for(let k=0;k<16;k++){const a1=k/16*Math.PI*2,a2=(k+1)/16*Math.PI*2;ap.push(...W([Math.cos(a1)*r,y,Math.sin(a1)*r]),...W([Math.cos(a2)*r,y,Math.sin(a2)*r]));}}
    else for(let k=0;k<4;k++){const a=t.corner(k,y),b=t.corner((k+1)%4,y),o=1.04;ap.push(...W([a[0]*o,y,a[2]*o]),...W([b[0]*o,y,b[2]*o]));}
  });
  line(ap,0x8a1c1c);
  // 구명줄 아래 하부클램프
  {const p=t.pole?W([-(t.poleR(.6)+.25)*.7,.6,-(t.poleR(.6)+.25)*.7]):(c=>W([c[0]-.3,.6,c[2]-.3]))(t.corner(0,.6));
   const bx=new T.Mesh(new T.BoxGeometry(.35,.5,.35),new T.MeshLambertMaterial({color:0xff7a00}));bx.position.set(p[0],p[1],p[2]);g.add(bx);}

  if(!t.pole&&G.pos&&t.segTo>t.segFrom){
    const P=G.pos, C=G.col, nseg=(t.segTo-t.segFrom)/6;
    const geo=new T.BoxGeometry(1,1,1), mA=new T.InstancedMesh(geo,new T.MeshLambertMaterial({color:0xffffff}),nseg), mB=new T.InstancedMesh(geo,new T.MeshLambertMaterial({color:0xffffff}),nseg);
    const a=new T.Vector3(),b=new T.Vector3(),d=new T.Vector3(),up=new T.Vector3(0,1,0),q=new T.Quaternion(),m4=new T.Matrix4(),sc=new T.Vector3(),ps=new T.Vector3(),ex=new T.Vector3(),ez=new T.Vector3(),col=new T.Color();
    let k=0;
    for(let i=t.segFrom;i<t.segTo;i+=6){

      const main=Math.abs(d.y)>.8&&len>t.H*.025;            // 주주재(기둥)

      ps.addVectors(a,b).multiplyScalar(.5).addScaledVector(ez,w/2); sc.set(tk,len,w); m4.compose(ps,q,sc); mB.setMatrixAt(k,m4); if(mB.setColorAt) mB.setColorAt(k,col);
      k++;
    }
    mA.count=k; mB.count=k; [mA,mB].forEach(m=>{if(m.instanceColor)m.instanceColor.needsUpdate=true;g.add(m);});
    // 이음판 + 볼트
    const J=t.joints||[], pl=Math.max(.45,t.H*.012);
    const gm=new T.InstancedMesh(new T.BoxGeometry(1,1,1),new T.MeshLambertMaterial({color:0x8d969c}),J.length);
    const bm=new T.InstancedMesh(new T.SphereGeometry(1,6,4),new T.MeshLambertMaterial({color:0x3e4448}),J.length*4);
    let kb=0; q.setFromAxisAngle(up,-(t.th||0));
    J.forEach((p,i)=>{ps.set(p[0],p[1],p[2]);sc.set(pl,pl*1.2,pl);m4.compose(ps,q,sc);gm.setMatrixAt(i,m4);

async function pushAll(){
  clearTimeout(flushT); flushT=null;
  while(flushing) await new Promise(ok=>setTimeout(ok,200));
  const now={}; lines.forEach(l=>now[l.id]=JSON.stringify(l));
  const up=lines.map(l=>({id:l.id,data:JSON.parse(now[l.id]),updated_by:CLIENT}));
  const {data,error}=await sb.from(T_LINES).upsert(up).select('id,updated_at'); if(error) throw error;
  up.forEach(x=>serverHash[x.id]=now[x.id]); (data||[]).forEach(x=>serverStamp[x.id]=x.updated_at);
  const {data:all,error:e2}=await sb.from(T_LINES).select('id'); if(e2) throw e2;
  const gone=all.map(x=>x.id).filter(id=>!(id in now));
  if(gone.length){const {error:e3}=await sb.from(T_LINES).delete().in('id',gone); if(e3) throw e3; gone.forEach(id=>{delete serverHash[id];delete serverStamp[id];});}

function groupCard(t,tp,g){
  const tid=t.d.id, gk=tid+'|'+g.id;
  const c=el('div','photo-card');
  const ids=g.sides.map(([s])=>g.id+'_'+s);
  const done=ids.filter(s=>photosOf(tid,s).length).length;
  const head=el('div','group-head');
  head.append(el('b',null,g.label),el('small',null,`${done}/${ids.length}측 등록`));
  c.append(head);
  if(SEQ_ITEMS[g.id]&&AS){const sb2=el('button','primary seq-mini',`📷 ${SEQ_ITEMS[g.id]} 여러 장 순서대로 (빈 칸부터)`);sb2.type='button';sb2.onclick=()=>openSeq(g.id);c.append(sb2);}
  const curN=g.nums?(numSel[gk]||'1'):null;
  const curT=g.nums?(TIER_KEYS.includes(tierSel[gk])?tierSel[gk]:'u'):null;
  const inNo=([s,n,tr])=>!g.nums||((s.includes('2_')?'2':'1')===curN&&(!tr||tr===curT));
  if(g.nums){
    const mk=(arr,curv,set)=>{const bar=el('div','seg');arr.forEach(([v,l])=>{const b=el('button',null,l);b.type='button';b.setAttribute('aria-pressed',curv===v);b.onclick=()=>{set(v);renderLedger();};bar.append(b);});c.append(bar);};
    mk([['1','#1'],['2','#2']],curN,v=>{numSel[gk]=v;});
    mk(TIERS,curT,v=>{tierSel[gk]=v;});
  }
  const renderSide=([sfx,nm])=>{
    const sid=g.id+'_'+sfx, label=g.label+' ('+nm+')', list=photosOf(tid,sid);
    const sec=el('div','side');
    const cl=(g.legs&&t.d.vleg&&t.d.vleg[sfx])||'';
    sec.append(el('div','side-head',`${nm}${cl?' · '+cl+'각':''} · ${list.length}장`));
    if(g.legs&&g.legs[sfx]){
      const bar=el('div','seg');
      g.legs[sfx].forEach(Lg=>{const b=el('button',null,Lg+'각');b.type='button';b.setAttribute('aria-pressed',cl===Lg);
        b.onclick=()=>{t.d.vleg=t.d.vleg||{};t.d.vleg[sfx]=cl===Lg?'':Lg;save();renderLedger();};bar.append(b);});
      sec.append(bar);
    }
    const f=fileInput({id:sid,label},true);
    const b=el('button','upload-btn','＋ '+nm+' 사진 추가');b.type='button';b.onclick=()=>choosePhoto(f);
    sec.append(thumbs(list,label),b);
    (g.sub||[]).forEach(([u,un])=>{ // 하부클램프 등 보조 사진 (선택)
      const sid2=sid+'_'+u, label2=g.label+' ('+nm+' '+un+')', l2=photosOf(tid,sid2);
      sec.append(el('div','side-head',`${nm} ${un} · ${l2.length}장 (선택)`));
      const f2=fileInput({id:sid2,label:label2},true);
      const b2=el('button','upload-btn','＋ '+nm+' '+un+' 사진 추가');b2.type='button';b2.onclick=()=>choosePhoto(f2);
      sec.append(thumbs(l2,label2),b2);
    });
    c.append(sec);
  };
  g.sides.filter(inNo).forEach(renderSide);
  if(g.optSides){
    const has=g.optSides.some(([s])=>photosOf(tid,g.id+'_'+s).length>0);
    const on=has||!!(t.d.sup&&t.d.sup[g.id]);
    const lb=el('label','check');

async function shrink(file){
  try{
    const bmp=await createImageBitmap(file);
    const s=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(r,'image/jpeg',.8))||file;
  }catch(e){return file;}
}

/* 사진 ZIP: 부산경남 기술팀/선로/철탑/항목.jpg */
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function makeZip(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  const n=new Date(),dt=((n.getFullYear()-1980)<<9)|((n.getMonth()+1)<<5)|n.getDate(),tm=(n.getHours()<<11)|(n.getMinutes()<<5)|(n.getSeconds()>>1);
  for(const f of files){
    const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);
    parts.push(lh.buffer,nm,f.data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cen.push(ch.buffer,nm);
    off+=30+nm.length+sz;
  }
  let cs=0;cen.forEach(b=>cs+=b.byteLength);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cen,end.buffer],{type:'application/zip'});
}

  }
  if(play){
    if(!play.paused&&!play.done){play.d+=150*SPEEDS[speedIx]*dt;if(play.d>=pathInfo.total){play.d=pathInfo.total;play.done=true;pPlay.textContent='↺';}}
    const pa=pathAt(play.d), pp=pa.p, ax=Math.cos(pa.h), az=Math.sin(pa.h), sx2=-az, sz2=ax;
    walker.visible=true; walker.position.set(pp.x,pp.y+6,pp.z);
    if(!play.paused){
      const k=1-Math.exp(-dt*2.5);
      controls.target.lerp(v.set(pp.x+ax*120-sx2*60,pp.y,pp.z+az*120-sz2*60),k);
      camera.position.lerp(v.set(pp.x-ax*520+sx2*460,pp.y+260,pp.z-az*520+sz2*460),k);
    }
    let c=-1; towers.forEach((t,i)=>{if(play.d>=pathInfo.towerS[i]-10)c=i;});
    if(c!==play.cur){
      play.cur=c; const t=c>=0?towers[c]:null, old=selT; selT=t;
      if(old) updateTag(old);
      if(t){updateTag(t);towers.forEach(z=>z.chip&&z.chip.classList.toggle('on',z===t));if(t.chip)chipsEl.scrollLeft=t.chip.offsetLeft-chipsEl.clientWidth/2;}
      updateMarker(); if(t) renderCard();
    }
    const fromN=play.cur>=0?H_(towers[play.cur]):'시점', toN=play.cur<towers.length-1?H_(towers[play.cur+1]):'종점';
    const cx=play.cur>=0&&play.cur<towers.length-1?crossOf(towers[play.cur].d):[];
    pText.innerHTML=`${play.done?'종점 도착':esc(fromN)+' → '+esc(toN)}${cx.map(c=>' · '+c.name).join('')} <span>${(play.d/1000).toFixed(2)} / ${(pathInfo.total/1000).toFixed(2)} km</span>`;
    pBar.style.width=(play.d/pathInfo.total*100)+'%';
  }
  if(strobes.length){const hi=reduceMotion||(now%1000)<140, mid=reduceMotion||(now%1500)<750;const low=reduceMotion||(now%2000)<1000;strobes.forEach(s=>{const on=s.kind==='high'?hi:s.kind==='mid'?mid:low;s.m.visible=on;s.glow.visible=on;});}
  controls.update(); renderer.render(scene,camera);
  if(showTags){
    const w=host.clientWidth,h=host.clientHeight;
    // 번호 라벨이 겹치면 건너뜀 (선택한 철탑은 항상 표시)
    let lastX=-1e9;
    towers.forEach(t=>{
      const p=proj(t.x,t.y+t.H+8,t.z,w,h);
      const hide=()=>{show(t.tag,false);if(t.landTag)show(t.landTag,false);if(t.kudzuTag)show(t.kudzuTag,false);};
      if(!p) return hide();
      if(t!==selT&&Math.abs(p[0]-lastX)<52) return hide();
      lastX=p[0]; show(t.tag,true); put(t.tag,p);
      if(t.landTag||t.kudzuTag){const g=proj(t.x,t.y,t.z,w,h);let dy=26;
        [t.landTag,t.kudzuTag].forEach(el=>{if(!el)return;if(g){show(el,true);put(el,g,dy);dy+=22;}else show(el,false);});}
    });
    if(selT&&selT.tag){const p=proj(selT.x,selT.y+selT.H+8,selT.z,w,h);if(p){show(selT.tag,true);put(selT.tag,p);}}
    spans.forEach(s=>{
      const p=s.tags.length?proj(s.x,s.y-8,s.z,w,h):null;
      s.tags.forEach((el,k)=>{if(!p)show(el,false);else{show(el,true);put(el,p,k*24);}});
    });
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
