name: 철탑3D APK 빌드

on:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 안드로이드 프로젝트 만들기
        working-directory: android-app
        env:
          BUILD_NO: ${{ github.run_number }}
        run: |
          npm install
          npx cap add android
          python3 patch.py
          npx cap sync android

      - name: 서명 키 넣기 (매번 같은 키여야 덮어 설치돼요)
        run: |
          mkdir -p ~/.android
          cp android-app/tower3d.keystore ~/.android/debug.keystore

      - name: 빌드
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 파일 이름 정리
        run: |
          mkdir -p out
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk out/tower3d-1.0.${{ github.run_number }}.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: tower3d-apk
          path: out/*.apk

      - name: 릴리스에 올리기 (휴대폰에서 바로 받기)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tower3d-${{ github.run_number }}
          name: 철탑3D 앱 1.0.${{ github.run_number }}
          make_latest: false
          files: out/*.apk
          body: |
            휴대폰에서 아래 apk 파일을 눌러 받아 설치하세요.
            순시(GPS)를 켜면 알림줄에 "철탑 순시 기록 중"이 떠요. 화면이 꺼져도 기록돼요.
