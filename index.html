<style>
/* Layout: full-bleed 3D terrain with one straight line at a time; line summary top-left, detail card right (bottom on phones), line picker + tower rail along the bottom */
:root{
  --sky:#dbe3e6;
  --surface:rgba(250,251,250,.95);
  --ink:#1b2226;
  --muted:#59666c;
  --line:#c4ced2;
  --accent:#dd6a17;
  --accent-ink:#ffffff;
  --steel:#3a4247;
  --wire:#1f6fb8;
  --road:#4a4f52;
  --water:#3f8fc2;
  --river:#2a6fd6;
  --railc:#7a4fb5;
  --urban:#b0762a;
  --paddy:#5e9a2e;
  --field:#9a7b3c;
  --kudzu:#2f6b23;
  --slope:#8a5a2b;
  --danger:#c43a3a;
  --card:#ffffff;
  --soft:#e3e9ec;
  --ok:#1f8a4c;
  --ui:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#0f1518; --surface:rgba(21,28,32,.95); --ink:#e3e9eb; --muted:#91a0a6; --line:#2c383d;
    --accent:#f08a3a; --accent-ink:#1a1006; --steel:#b1bbc0; --wire:#6fb4f0; --road:#55595c; --water:#4aa3d8; --river:#5b9cf5; --railc:#a983e0; --urban:#d79a4a; --paddy:#7fbf4a; --field:#c4a160; --kudzu:#4f9a3a; --slope:#c08a55; --danger:#ef6b6b; --card:#182126; --soft:#26333a; --ok:#3fb36f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky:#0f1518; --surface:rgba(21,28,32,.95); --ink:#e3e9eb; --muted:#91a0a6; --line:#2c383d;
  --accent:#f08a3a; --accent-ink:#1a1006; --steel:#b1bbc0; --wire:#6fb4f0; --road:#55595c; --water:#4aa3d8; --river:#5b9cf5; --railc:#a983e0; --urban:#d79a4a; --paddy:#7fbf4a; --field:#c4a160; --kudzu:#4f9a3a; --slope:#c08a55; --danger:#ef6b6b; --card:#182126; --soft:#26333a; --ok:#3fb36f; color-scheme:dark;
}
[hidden]{display:none !important}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden}
#scene{position:absolute;inset:0;touch-action:none}
#scene canvas{display:block;width:100%;height:100%}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
button,input,select{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tag{position:absolute;left:0;top:0;pointer-events:auto;touch-action:none;cursor:pointer;display:inline-flex;align-items:center;gap:4px;will-change:transform;
  font:600 11px/1 var(--mono);font-variant-numeric:tabular-nums;padding:3px 6px;
  background:var(--surface);color:var(--ink);border:1px solid var(--line);white-space:nowrap;border-radius:99px}
.tag.ten{border-radius:2px;border:1.5px solid var(--ink)}
.tag .angb{font-style:normal;font-size:10.5px;padding:2px 5px;margin-left:2px;border-radius:99px;background:#6d28d9;color:#fff;letter-spacing:-.2px}
.tag.on .angb{background:#fff;color:#6d28d9}
.tag.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag.danger-tag{border-color:var(--danger);box-shadow:0 0 0 1.5px var(--danger)}
.tag.danger-tag.on{background:var(--danger);color:#fff;border-color:var(--danger)}
.tag .warn{font-style:normal;font-size:11px;line-height:1}
.danger-check{border:1px solid var(--danger);border-radius:8px;padding:8px 10px;margin-top:6px}
.xtag{position:absolute;left:0;top:0;pointer-events:none;font:600 10.5px/1 var(--ui);padding:4px 7px;border-radius:4px;color:#fff;white-space:nowrap;will-change:transform}
.xtag.road{background:var(--road);border:1px solid rgba(255,255,255,.35)}
.xtag.river{background:var(--river)}
.xtag.xrail{background:var(--railc)}
.ground{position:absolute;left:0;top:0;pointer-events:none;font:600 10.5px/1 var(--ui);padding:3px 7px;border-radius:99px;color:#fff;white-space:nowrap;will-change:transform;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.xtag.valley{background:var(--water)}
.xtag.ball{background:#e2581b}
.qty{display:flex;align-items:center;gap:8px}
.arrrow{display:flex;align-items:center;gap:8px;margin-top:6px}
.arrrow>.lb{min-width:64px;white-space:nowrap}
.arrrow .seg{flex:1}
.arrrow .seg button{padding-left:4px;padding-right:4px;font-size:12px}
/* v13: 없음·피뢰기·아킹혼·링 3칸 — 좁은 화면(분할)에서는 이름 아래 줄로 내려서 다 보이게 */
.arrrow{flex-wrap:wrap}
.arrrow .seg{display:grid;grid-template-columns:repeat(3,1fr);min-width:0}
.arrrow .seg button{white-space:nowrap;overflow:hidden;text-overflow:clip}
@media (max-width:640px){.arrrow .seg{flex:1 1 100%}}
body.split .arrrow .seg{flex:1 1 100%}
.qty .stepper,.qty .seg{flex:1}
.lampbox{display:grid;gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px}
/* v20.19: 고광도·중광도·저광도 세 칸을 같은 너비로, 좁아도 다 보이게 */
.lampbox .seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));min-width:0}
.lampbox .seg button{display:flex;align-items:center;justify-content:center;gap:4px;min-width:0;padding:9px 2px;font-size:13px;white-space:nowrap;overflow:hidden}
.lampbox .seg button .ldot{flex:none}
.ldot{display:inline-block;width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 1px var(--line);margin-right:5px;vertical-align:-1px}
.lamplist{display:flex;flex-wrap:wrap;gap:6px}
.lampmk{border-top:1px dashed var(--line);padding-top:8px}
.lampmk summary{cursor:pointer;font-size:13px}
.lampmk .mkgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.lampchip{display:inline-flex;align-items:center;flex-wrap:wrap;font-size:12.5px;font-weight:600;padding:5px 9px;border-radius:6px;background:color-mix(in srgb,var(--ink) 7%,transparent)}
.lampchip small{font-weight:400;color:var(--muted);margin-left:6px}
.hipos{margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:8px}
.hipos table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12.5px}
.hipos th{font-weight:600;color:var(--muted);padding:4px 2px;text-align:center}
.hipos td{text-align:center;padding:2px}
.hipos td label{display:flex;justify-content:center;align-items:center;padding:8px 0;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.hipos td label:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.hipos input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.hipos .hipt{margin-top:6px;font-size:12.5px}
.lamps{display:grid;gap:6px}
.lamps[aria-disabled="true"]{opacity:.45;pointer-events:none}
.lamprow{display:grid;grid-template-columns:1fr 92px;align-items:center;gap:8px}
.lamprow>span{display:flex;align-items:center;gap:6px;font-size:13px;flex-wrap:wrap}
.lamprow>span i{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.lamprow small{font-size:11px;color:var(--muted);width:100%;padding-left:16px}
.lamprow input{padding:7px 30px 7px 10px !important;font-size:14px}
.qty[aria-disabled="true"]{opacity:.45;pointer-events:none}
.sym{display:inline-block;width:8px;height:8px;flex:0 0 auto}
.sym.sus{border-radius:50%;border:1.5px solid currentColor}
.sym.ten{background:currentColor}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.head{position:absolute;top:12px;left:max(16px, env(safe-area-inset-left,0px));max-width:min(330px, calc(100% - 32px));padding:12px 14px;display:grid;gap:5px}
.eyebrow{font:600 10px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
body.headmin .head .eyebrow,body.headmin .head .sync,body.headmin .head .stats,body.headmin .head .legend{display:none!important}
body.headmin .head{padding:8px 12px;gap:0}
body.headmin .head h1{font-size:15px}
.head h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.stats .pk{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;border-radius:4px;padding:1px 2px}
.stats .pk.on{background:var(--accent);color:var(--accent-ink);text-decoration:none}
.stats .pklist{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px;max-height:96px;overflow:auto;white-space:normal}
.stats .pklist b{font-family:var(--ui);font-size:11.5px;margin-right:2px}
.stats .pklist button{font:600 12px/1 var(--ui);padding:6px 9px;border-radius:99px;border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer}
.stats .pklist button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.head .stats{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;line-height:1.5;white-space:pre-line}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .sw{width:12px;height:8px;border-radius:2px}

.card{position:absolute;top:12px;right:max(16px, env(safe-area-inset-right,0px));width:300px;padding:14px;display:grid;gap:11px;max-height:calc(100% - 190px);overflow:auto}
.card-top{display:flex;align-items:center;gap:8px;min-width:0}
.card-top .no{font:600 22px/1 var(--mono)}
.card-top h2{margin:0;font-size:15px;font-weight:700;line-height:1.3;min-width:0}
.sub{font-size:12px;color:var(--muted);margin-top:-6px}
.pill{font-size:11px;font-weight:600;padding:3px 8px;border:1.5px solid var(--line);color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;border-radius:99px}
.pill.ten{border-color:var(--ink);color:var(--ink);border-radius:3px}
.close{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:6px}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px}
.card dt{color:var(--muted)}
.card dd{margin:0;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.field{display:grid;gap:6px;min-width:0}
.lb,.field>label{font-size:11.5px;color:var(--muted)}
.field input[type=text],.field input[type=number]{font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
.field input[type=number]{font-family:var(--mono)}
.unit{position:relative}
.unit input{padding-right:34px !important}
.unit::after{content:attr(data-unit);position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.renrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}.renrow>.lb{width:56px;flex:none}.renrow>.seg{flex:1 1 150px;min-width:150px}.renrow>.unit{flex:0 0 84px}.renrow .seg button{padding-left:4px;padding-right:4px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);padding:7px 8px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sky);font-weight:600}
.kvq{display:flex;gap:4px;flex-wrap:wrap}
.kvq button{font:500 12px/1 var(--mono);padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.kvq button[aria-pressed="true"]{background:var(--ink);color:var(--sky);border-color:var(--ink)}
.checks{display:grid;gap:6px}
.check{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink)}
.check input{width:18px;height:18px;margin:0;accent-color:var(--accent);flex:0 0 auto}
.check .sw{width:12px;height:8px;border-radius:2px;margin-left:auto;flex:0 0 auto}
.primary{border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:13px;padding:10px 12px;cursor:pointer}
.ghost{border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font-size:12.5px;padding:9px 10px;cursor:pointer}
.danger{color:var(--danger);border-color:var(--danger)}
.err{margin:0;font-size:12px;color:var(--danger)}
.note{font-size:11.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;line-height:1.45;margin:0}
.actions{display:grid;gap:6px}
.sync{justify-self:start;font:600 10.5px/1 var(--ui);padding:4px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.sync.ok{color:#1f8a4c;border-color:#1f8a4c}
.sync.busy{color:var(--muted)}
.sync.err{color:var(--danger);border-color:var(--danger)}
.login{position:fixed;inset:0;z-index:50;background:var(--sky);display:grid;place-items:center;overflow:auto;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:24px}
.login-card{width:min(380px,100%);padding:18px;display:grid;gap:12px}
.login-card h2{margin:0;font-size:18px;font-weight:700}
.field input[type=email],.field input[type=password]{font-size:15px;padding:10px 11px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
.field textarea{font:12px/1.4 var(--mono);padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);resize:vertical;min-width:0;width:100%;box-sizing:border-box;word-break:break-all}

.rail{position:absolute;left:0;right:0;bottom:0;display:grid;gap:8px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:0 calc(12px + env(safe-area-inset-bottom,0px))}
.tools{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;align-items:center}
.tools::-webkit-scrollbar{display:none}
.tools select{font-size:13px;font-weight:600;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:56vw;flex:0 1 auto}
.btn{font-size:12.5px;padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;flex:0 0 auto}
.btn[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
.chips{display:flex;gap:4px;overflow-x:auto;padding:6px;scrollbar-width:thin}
.chip{flex:0 0 auto;display:grid;gap:4px;text-align:left;padding:7px 10px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--ink);cursor:pointer}
.chip b{font:600 13px/1 var(--mono);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip span{font:500 10.5px/1 var(--mono);color:var(--muted);white-space:nowrap;display:flex;gap:4px;align-items:center}
.chip span i{width:8px;height:6px;border-radius:1px;display:inline-block}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chip.on span{color:var(--accent-ink)}

.playbar{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:10px;padding:8px 10px}
.playbar .ic{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font-size:14px;display:grid;place-items:center}
.playbar .ic.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pinfo{min-width:0;display:grid;gap:5px}
#gpsbar{grid-template-columns:auto 1fr auto auto}
#gpsbar .arr{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);width:auto;padding:0 10px;font-weight:700;font-size:13px;white-space:nowrap}
#mapOv{position:fixed;inset:0;z-index:50;background:var(--bg,#fff);display:flex;flex-direction:column}
#mapOv[hidden]{display:none}
#mapOv .mbar{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
#mapBox{flex:1;position:relative}
.kbar{position:absolute;left:8px;top:8px;z-index:10;display:flex;gap:4px}
.kbar button{font:600 12.5px/1 var(--ui);padding:7px 9px;border-radius:6px;border:1px solid #9aa;background:#fff;color:#222;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.kbar button.on{background:#e8833a;color:#fff;border-color:#e8833a}
.kpop{position:relative;background:#fff;color:#14213d;border-radius:10px;padding:10px 12px 8px;min-width:170px;max-width:240px;box-shadow:0 3px 12px rgba(0,0,0,.35);font:13px/1.4 var(--ui)}
.lotpop{font:13px/1.45 var(--ui);color:#14213d;padding-right:14px}
.lotpop .lotj{font-size:14.5px;display:block}
.lotpop .lotr,.lotpop .lotm{font-size:12.5px;color:#333;margin-top:2px}
.elv{margin:8px 0 2px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;line-height:1.55}
.elv b{font-size:15px}.elv .en{display:block;font-size:11.5px;opacity:.75;margin-top:2px}
.jise{margin:10px 0 4px;padding:10px;border:1px solid var(--line);border-radius:12px}
.jise .jh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
.jise .jg{padding:2px 10px;border-radius:999px;font-size:13.5px;color:#fff}
.jg0{background:#2e7d4f}.jg1{background:#c98a00}.jg2{background:#c0392b}.jgn{background:#8a8f94}
.jise table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}
.jise td{padding:4px 2px;border-top:1px solid var(--line);vertical-align:middle}
.jise td:last-child{text-align:right;white-space:nowrap}
.jise .jc{display:inline-block;min-width:44px;text-align:center;padding:1px 6px;border-radius:6px;font-size:11.5px;color:#fff}
.jise .jrow{margin-top:8px}.jise .jrow .lb{font-size:12px}
.jise .seg button{font-size:12px;padding:5px 6px}
.jise .jn{font-size:11.5px;opacity:.75;margin-top:6px;line-height:1.5}
.elv .jise{margin:8px 0 0;padding:8px 0 0;border:0;border-top:1px dashed var(--line);border-radius:0}
.jise summary{cursor:pointer;list-style:none}.jise summary::-webkit-details-marker{display:none}
.jise summary::after{content:'▾ 펼치기';margin-left:auto;font-size:12px;font-weight:400;opacity:.7}
.jise[open] summary::after{content:'▴ 접기'}
.jv{background:none;border:0;border-bottom:1px dashed currentColor;padding:2px 2px;font:inherit;color:inherit;cursor:pointer}
.jv.man{color:var(--accent);font-weight:700}
.jvin{width:84px;font:inherit;padding:3px 6px}
.lotpop .lotw{font-size:12px;color:#b35b00;margin-top:3px}
.lotpop .lotll{display:block;font-size:11.5px;color:#777;margin-top:3px}

<script>
(function(){
const T=THREE;
const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const KV_QUICK=[154,345,765];
const stripTL=n=>String(n).replace(/\s*T\s*\/\s*L\s*$/i,'').trim();
const LN=l=>stripTL(l.name)+' T/L';
const baseH=kv=>kv<=30?22:kv<=80?32:kv<=200?46:kv<=450?62:92;
const CIRC_MUL={2:1,4:1.32,6:1.45};
const MAX_TOWERS=300;
const defGW=kv=>kv===154?1:2;
const gwOf=(l,d)=>d&&(d.gwN===1||d.gwN===2)?d.gwN:l.gw;   // v20.13: 철탑마다 가공지선 조수(1조↔2조 바뀌는 구간)
const gwPairs=(a,b)=>{const A=Object.keys(a.attach).filter(k=>a.attach[k].gw),B=Object.keys(b.attach).filter(k=>b.attach[k].gw);if(!A.length||!B.length||A.some(k=>B.includes(k)))return [];return A.length===1?B.map(k=>[A[0],k]):A.map(k=>[k,B[0]]);};   // 154kV는 가공지선 1조(꼭대기 가운데), 345·765kV는 2조
const WT=['OPGW','GW'];
const gwTxt=l=>l.gw===1?`가공지선 1조(${l.gw1})`:`가공지선 2조(#1 ${l.gw1}·#2 ${l.gw2})`;
// v21.30: 도체 수 — 154kV 단도체/복도체, 345kV 2/4도체 선택 (기본: 154 단도체, 345 4도체), 765kV 6도체 고정
const bunDef=kv=>kv>=700?6:kv>=300?4:1;
const bunOpts=kv=>kv>=700?[6]:kv>=300?[2,4]:kv>=100?[1,2]:[1];
const bunOf=l=>{const o=bunOpts(+l.kv||0);return o.includes(+l.bun)?+l.bun:bunDef(+l.kv||0);};
const bunTxt=n=>n===1?'단도체':n===2?'복도체':n+'도체';
const wireOfKey=(l,key)=>key==='g-1'?l.gw2:l.gw1;          // g1·g0 = #1(또는 가운데), g-1 = #2
const lineHas=(l,w)=>l.gw===1?l.gw1===w:(l.gw1===w||l.gw2===w);
const OPGW_C=new T.Color('#2b7bb9');   // 3D에서 OPGW는 파란빛으로 구분

/* ---------- 데이터 (Supabase 서버에 저장 · 로그인한 직원끼리 공유) ----------

  pulling=true;
  try{
    const {data,error}=await sb.from(T_LINES).select('id,updated_at');
    if(error) throw error;
    const ids=new Set(data.map(r=>r.id));
    const changed=data.filter(r=>serverStamp[r.id]!==r.updated_at).map(r=>r.id);
    const removed=Object.keys(serverStamp).filter(id=>!ids.has(id));
    let touchCur=false, touched=false;
    for(let i=0;i<changed.length;i+=40){
      const {data:rows,error:e2}=await sb.from(T_LINES).select('id,data,updated_at').in('id',changed.slice(i,i+40));
      if(e2) throw e2;
      rows.forEach(r=>{
        if(isDirty(r.id)&&serverHash[r.id]!==undefined){serverStamp[r.id]=r.updated_at;return;}
        const d=normalize(r.data); d.id=r.id;
        serverHash[r.id]=JSON.stringify(d); serverStamp[r.id]=r.updated_at;
        const ix=lines.findIndex(l=>l.id===r.id);
        if(ix>=0) lines[ix]=d; else lines.push(d);
        if(r.id===curId) touchCur=true; touched=true;
      });
    }
    removed.forEach(id=>{
      delete serverStamp[id]; delete serverHash[id];
      const n=lines.length; lines=lines.filter(l=>l.id!==id);
      if(lines.length!==n){touched=true; if(id===curId) touchCur=true;}
    });
    if(!lines.length){lines=[{id:'l'+rid(),name:'새 선로',kv:154,circuits:2,seed:7,towers:range(1,10)}];save();}
    if(!lines.find(l=>l.id===curId)){curId=lines[0].id;selT=null;card.hidden=true;touchCur=true;}
    writeCache();
    if(ALL){if(touched)rebuildSoon();} else if(touchCur) rebuildSoon(); else if(touched) renderHead();
    await pullPhotos();
    if(!flushT&&!flushing){const d=new Date();syncState('ok','공유 중 · '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')+' 확인');}
  }catch(e){console.error(e);syncState('err','연결 끊김 · 다시 시도 중');}
  finally{pulling=false;}
}
async function pullPhotos(force){
  // v21.42: 서버는 한 번에 1000장까지만 줌 → 1000장씩 나눠서 끝까지 받음 (1000장 넘으면 새 사진이 안 보이고 중복 첨부되던 문제)
  // v21.63: 10초마다 사진 목록 전체를 받던 것 → 개수·마지막 수정 시각만 먼저 보고, 바뀌었을 때만 전체를 받음 (버퍼링 줄임)
  if(!force&&photoStamp){const {data:top,count,error:e0}=await sb.from(T_PHOTOS).select('updated_at',{count:'exact'}).order('updated_at',{ascending:false}).limit(1);
    if(!e0&&(count+'|'+((top&&top[0]&&top[0].updated_at)||''))===photoStamp) return;}
  const data=[];
  for(let from=0;from<200000;from+=1000){
    const {data:part,error}=await sb.from(T_PHOTOS).select('id,data,updated_at').order('id').range(from,from+999);
    if(error) throw error;
    data.push(...part); if(part.length<1000) break;
  }
  const stamp=data.length+'|'+data.reduce((a,r)=>a>r.updated_at?a:r.updated_at,'');
  if(!force&&stamp===photoStamp) return;
  photoStamp=stamp;
  photos=data.map(r=>Object.assign({},r.data,{id:r.id}));
  photosChanged();
}
async function signFor(list){
  const need=[...new Set(list.filter(p=>p.path&&!urlCache[p.path]).map(p=>p.path))];
  if(!need.length||!sb) return false;
  const {data}=await sb.storage.from(BUCKET).createSignedUrls(need,21600);
  let got=false; (data||[]).forEach(d=>{if(d.signedUrl){urlCache[d.path]=d.signedUrl;got=true;}});
  return got;
}

/* ---------- v21.11 변전소 철골타워(인출 구조물): 양쪽 철골 기둥 + 가로 보 + 내장 애자련, 꼭대기에 가공지선 ---------- */
function gantryInto(l,t,steel,pos,col){
  t.tension=true;
  const H=t.H, Hg=H*.6, c=cirOf(l,t.d), spec=armSpec(c);
  const ca=Math.cos(t.th||0), sa=Math.sin(t.th||0);
  const W=p=>[t.x+p[2]*ca+p[0]*sa, t.y+p[1], t.z+p[2]*sa-p[0]*ca];
  const seg=(a,q)=>{pos.push(...W(a),...W(q));col.push(steel.r,steel.g,steel.b,steel.r,steel.g,steel.b);};
  const w0=Hg*.045, cw=Math.max(.9,Hg*.04);
  let Xm=0; spec.arms.forEach(a=>{Xm=Math.max(Xm,w0/2+Hg*a.pts[a.pts.length-1]);}); Xm+=cw*.8;
  const lastA=spec.arms[spec.arms.length-1], topY=Hg*lastA.f+Hg*spec.ad+Hg*.06, bz=cw*.5;
  t.segFrom=pos.length; t.joints=[];
  const colm=cx=>{
    const cor=(k,y)=>{const f=1-.25*y/topY;return [cx+(k===0||k===3?-1:1)*cw/2*f,y,(k<2?-1:1)*cw/2*f];};
    const nb=Math.max(6,Math.round(topY/(cw*2.2)));
    for(let i=0;i<=nb;i++){const y=topY*i/nb;
      for(let k=0;k<4;k++){t.joints.push(W(cor(k,y)));seg(cor(k,y),cor((k+1)%4,y));}
      if(i<nb){const y2=topY*(i+1)/nb;
        for(let k=0;k<4;k++){const k2=(k+1)%4;seg(cor(k,y),cor(k,y2));seg(cor(k,y),cor(k2,y2));seg(cor(k2,y),cor(k,y2));}}}
    for(let k=0;k<4;k++){const q=cor(k,0);EXTRA.feet.push({p:W([q[0],0,q[2]]),s:Math.max(.8,Hg*.03)});}
  };
  [-Xm,Xm].forEach(colm);
  // 가로 보: 완금 높이마다 위·아래 현재 + 지그재그
  const beam=(hy,ad)=>{
    [-1,1].forEach(sz=>{const z=sz*bz;
      seg([-Xm,hy,z],[Xm,hy,z]); seg([-Xm,hy+ad,z],[Xm,hy+ad,z]);
      const N=Math.max(6,Math.round(2*Xm/(ad*1.1)));
      for(let j=0;j<N;j++){const u0=-Xm+2*Xm*j/N,u1=-Xm+2*Xm*(j+1)/N;

    for(let j=0;j<=6;j++){const x=-Xm+2*Xm*j/6;seg([x,hy,-bz],[x,hy,bz]);}

  const ins=Hg*.05, att={};
  [-1,1].forEach(s=>spec.arms.forEach((a,k)=>a.pts.forEach((pf,p)=>{
    const hy=Hg*a.f, x=s*(w0/2+Hg*pf);
    hangIns(l,t,W,seg,steel,s,x,hy,[x,hy,0],ins,s+'_'+k+'_'+p,att);})));
  // 가공지선: 꼭대기
  if(gwOf(l,t.d)===1){
    const tip=[0,topY+Hg*.09,0];
    seg([-bz,topY,-bz],tip);seg([bz,topY,-bz],tip);seg([bz,topY,bz],tip);seg([-bz,topY,bz],tip);
    att['g0']={back:W(tip),fwd:W(tip),gw:true};
  }else [-1,1].forEach(s=>{
    const tip=[s*Xm,topY+Hg*.07,0];
    seg([s*Xm,topY,-cw*.35],tip);seg([s*Xm,topY,cw*.35],tip);
    att['g'+s]={back:W(tip),fwd:W(tip),gw:true};
  });
  t.attach=att; t.segTo=pos.length; t.gantry=true;
  t.W=W; t.corner=(k,y)=>[(k===0||k===3?-1:1)*cw/2,y,(k<2?-1:1)*cw/2]; t.widthAt=()=>cw;
}

const REAL={};   // lineId → {key, dem, sat, st}

const SAT_SRC=()=>[
  ...(VWORLD_KEY?[{name:'브이월드 항공사진',vw:true,zMax:19,url:(z,x,y)=>`https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_KEY}/Satellite/${z}/${y}/${x}.jpeg`}]:[]),

async function satTiles(bb,maxPx,zCap){

const realOn=()=>lsGet('tower3d-real')!=='0', surfSat=()=>lsGet('tower3d-surf')!=='green';

function realLayout(l,spanOf){

  if(A.length<2)return null;

}
const IMGC=new Map();   // v20.10: 받은 지도 조각 기억 (최대 900장)
function loadImg(src,ms){
  if(IMGC.has(src)){const p=IMGC.get(src);IMGC.delete(src);IMGC.set(src,p);return p;}
  // v21.17: 응답 없는 조각 하나 때문에 지도 전체가 멈추지 않게 8초 넘으면 포기
  const p=new Promise((res,rej)=>{const im=new Image();im.crossOrigin='anonymous';
    const to=setTimeout(()=>{im.onload=im.onerror=null;im.src='';rej(new Error('시간 초과'));},ms||8000);
    im.onload=()=>{clearTimeout(to);res(im);};im.onerror=()=>{clearTimeout(to);rej(new Error('그림을 받지 못함'));};im.src=src;});

async function tilesToCanvas(bb,z,url,maxPx){
  const x0=mX(bb.w,z),x1=mX(bb.e,z),y0=mY(bb.n,z),y1=mY(bb.s,z);
  const tx0=Math.floor(x0/256),tx1=Math.floor(x1/256),ty0=Math.floor(y0/256),ty1=Math.floor(y1/256);
  const cv=document.createElement('canvas');cv.width=(tx1-tx0+1)*256;cv.height=(ty1-ty0+1)*256;

  const k=e.target.closest('[data-pk]'); if(k){pickKey=pickKey===k.dataset.pk?null:k.dataset.pk; if(world&&world.userData.balls)world.userData.balls.visible=pickKey==='ball'; if(!ALL)makeCrossTags(); renderHead();}
});
function renderHead(){
  const l=cur();
  const cx=[4,6,2].filter(c=>c!==l.circuits).map(c=>[c,l.towers.filter(d=>cirOf(l,d)===c).length]).filter(x=>x[1]);
  document.getElementById('eyebrow').textContent=`${l.kv}kV · ${l.circuits}회선${cx.length?' ('+cx.map(x=>x[0]+'회선 '+x[1]+'기').join(' · ')+')':''} · ${bunTxt(bunOf(l))} · ${gwTxt(l)}`;
  document.getElementById('titleTx').textContent=LN(l);
  const nT=towers.filter(t=>t.tension).length;
  const first=towers[0].label, last=towers[towers.length-1].label;
  if(pickLine!==l.id){pickLine=l.id;pickKey=null;}
  const pk=(k,txt,n)=>n>0?`<span class="pk${pickKey===k?' on':''}" data-pk="${k}" role="button">${txt}</span>`:txt;
  const lampSum=towers.filter(t=>t.lamp).reduce((a,t)=>({high:a.high+t.lampN.high,mid:a.mid+t.lampN.mid,low:a.low+t.lampN.low}),{high:0,mid:0,low:0});
  const hit=pickKey&&PICKS[pickKey]?towers.filter(PICKS[pickKey].f):[];
  document.getElementById('stats').innerHTML=`${NO(esc(first))}~${NO(esc(last))} · 철탑 ${towers.length}기 (현수 ${towers.length-nT} · 내장 ${nT}${towers.some(t=>t.pole)?' · 관형주 '+towers.filter(t=>t.pole).length:''})\n${(G.L/1000).toFixed(2)} km · ${pk('aviation','도색 '+towers.filter(PICKS.aviation.f).length,towers.filter(PICKS.aviation.f).length)} · ${pk('lamp','항공등 '+esc(lampTxt(lampSum,true)),towers.filter(PICKS.lamp.f).length)} · ${pk('ball','✈ 항공구 설치개소 '+towers.filter(PICKS.ball.f).length+'곳 ('+ballSum(l)+'개)',towers.filter(PICKS.ball.f).length)} · `
    +(SHOW_CROSS?CROSS.map(c=>{const n=towers.filter(PICKS[c.k].f).length;return pk(c.k,c.name.replace('횡단','')+' '+n,n);}).join(' · ')+'\n':'')
    +LAND.map(x=>{const n=towers.filter(PICKS[x.k].f).length;return pk(x.k,x.name+' '+n+'기',n);}).join(' · ')
    +' · '+pk('kudzu','칡넝쿨 '+towers.filter(PICKS.kudzu.f).length+'기',towers.filter(PICKS.kudzu.f).length)
    +' · '+pk('sanbok','산복개소 '+towers.filter(PICKS.sanbok.f).length+'기'+(()=>{const n=towers.filter(t=>t.d.sanbok&&t.d.sanbokSt==='보강 필요').length;return n?' (보강 필요 '+n+')':'';})(),towers.filter(PICKS.sanbok.f).length)
    +' · '+pk('lowClr','저지상고 '+towers.filter(PICKS.lowClr.f).length+'곳',towers.filter(PICKS.lowClr.f).length)
    +' · '+pk('fprot','기초보호설비 '+towers.filter(PICKS.fprot.f).length+'기'+(()=>{const n=towers.filter(t=>t.d.fpOn&&t.d.fpSt==='보수 필요').length;return n?' (보수 필요 '+n+')':'';})(),towers.filter(PICKS.fprot.f).length)
    +' · '+pk('gnd','매설지선 '+towers.filter(PICKS.gnd.f).length+'기',towers.filter(PICKS.gnd.f).length)
    +' · '+pk('mtag','모바일태그 '+towers.filter(PICKS.mtag.f).length+'기',towers.filter(PICKS.mtag.f).length)
    +(towers.some(PICKS.green.f)?' · '+pk('green','녹색 도장 '+towers.filter(PICKS.green.f).length+'기',towers.filter(PICKS.green.f).length):'')
    +(towers.some(PICKS.avEco.f)?' · '+pk('avEco','친환경 도색 '+towers.filter(PICKS.avEco.f).length+'기',towers.filter(PICKS.avEco.f).length):'')
    +' · '+pk('angle','각도주 '+towers.filter(PICKS.angle.f).length+'기',towers.filter(PICKS.angle.f).length)
    +'\n'+ARR_STAT.map(k=>{const n=towers.filter(PICKS['arr_'+k].f).length;return pk('arr_'+k,k+' '+n+'기',n);}).join(' · ')
    +'\n'+dmpGroups(l).map(g=>{if(g.k==='dmpGW'){const nb=towers.filter(t=>t.d.gwKind==='bait').reduce((a,t)=>a+dmpSum(t.d,g),0),nd=towers.filter(t=>t.d.gwKind!=='bait').reduce((a,t)=>a+dmpSum(t.d,g),0);return pk('dmpGW','GW 댐퍼 '+nd+'개',towers.filter(PICKS.dmpGW.f).length)+(nb?' · '+pk('gwBait','GW 배이트 '+nb+'개',towers.filter(PICKS.gwBait.f).length):'');}const n=towers.filter(PICKS[g.k].f).length;return pk(g.k,g.name+' '+towers.reduce((a,t)=>a+dmpSum(t.d,g),0)+'개',n);}).join(' · ')
    +(hit.length?`<span class="pklist"><b>${PICKS[pickKey].n} ${hit.length}기</b>${hit.map(t=>`<button type="button" data-go="${towers.indexOf(t)}"${selT===t?' class="on"':''}>${esc(H_(t))}</button>`).join('')}</span>`:'');
  lineSel.innerHTML=lines.slice().sort((a,b)=>(+b.kv||0)-(+a.kv||0)||String(LN(a)).localeCompare(String(LN(b)),'ko',{numeric:true})).map(x=>`<option value="${x.id}"${x.id===curId?' selected':''}>${esc(x.kv+'kV '+LN(x))}</option>`).join('');
}
function renderRail(){
  chipsEl.innerHTML='';
  const lc=document.createElement('button'); lc.type='button'; lc.className='chip'+(selT?'':' on');
  lc.innerHTML=`<b style="font-family:var(--ui)">선로 정보</b><span>수정</span>`;
  lc.addEventListener('click',()=>selectTower(null,true)); chipsEl.appendChild(lc);
  const frag=document.createDocumentFragment();
  towers.forEach(t=>{
    const c=document.createElement('button'); c.type='button'; c.className='chip'+(selT===t?' on':'');
    const pg=progress(t);
    c.innerHTML=`<b><i class="sym ${t.tension?'ten':'sus'}"></i>${esc(H_(t))}</b>`;   // v15: 아래 철탑 목록은 번호만 (자세한 건 철탑을 누르면 카드에)
    c.addEventListener('click',()=>selectTower(t)); frag.appendChild(c); t.chip=c;
  });
  chipsEl.appendChild(frag);
  if(selT&&selT.chip) chipsEl.scrollLeft=selT.chip.offsetLeft-chipsEl.clientWidth/2;
  document.documentElement.style.setProperty('--railH',document.getElementById('rail').offsetHeight+'px');
}
const segHTML=(attr,vals,curV,fmt)=>`<div class="seg">${vals.map(v=>`<button type="button" ${attr}="${v}" aria-pressed="${v===curV}">${fmt(v)}</button>`).join('')}</div>`;
const kvField=v=>`<div class="field"><span class="lb">전압</span>${segHTML('data-kvq',KV_QUICK,v,x=>x+'kV')}</div>`;
const nameField=v=>`<div class="field"><label for="fName">선로명 <span style="opacity:.8">(T/L은 자동으로 붙어요)</span></label><div class="unit" data-unit="T/L"><input id="fName" type="text" placeholder="예: 양산–김해" value="${esc(v)}" style="padding-right:42px"></div></div>`;

    <div class="field"><span class="lb">철탑 호수</span>

  q('.close').addEventListener('click',close); q('#addNo').addEventListener('click',close);

function kkAddr(pt){return new Promise(res=>{
  try{if(!(MP&&MP.kind==='kakao'&&kakao.maps.services))return res(null);
    new kakao.maps.services.Geocoder().coord2Address(pt[1],pt[0],(r,s)=>{if(s!==kakao.maps.services.Status.OK||!r[0])return res(null);
      res({jibun:r[0].address&&r[0].address.address_name||'',road:r[0].road_address&&r[0].road_address.address_name||''});});
  }catch(e){res(null);}});}
function vwLot(pt){return new Promise((res,rej)=>{
  if(!VWORLD_KEY)return rej(new Error('브이월드 키 없음'));
  const cb='vwLot'+Date.now()+'_'+Math.floor(Math.random()*1e5), s=document.createElement('script');
  const done=()=>{clearTimeout(to);try{delete window[cb];}catch(_){window[cb]=undefined;}s.remove();};
  const to=setTimeout(()=>{done();rej(new Error('브이월드가 응답하지 않아요'));},10000);
  window[cb]=d=>{done();const r=d&&d.response;
    if(!r)return rej(new Error('응답 형식 오류'));
    if(r.status==='NOT_FOUND')return res(null);
    if(r.status!=='OK')return rej(new Error((r.error&&(r.error.text||r.error.code))||r.status));
    const f=r.result&&r.result.featureCollection&&r.result.featureCollection.features;res(f&&f[0]||null);};
  s.onerror=()=>{done();rej(new Error('브이월드에 연결하지 못했어요'));};
  s.src='https://api.vworld.kr/req/data?service=data&version=2.0&request=GetFeature&data=LP_PA_CBND_BUBUN&format=json&errorFormat=json&size=1&page=1'
    +'&geometry=true&attribute=true&crs=EPSG:4326&geomFilter='+encodeURIComponent('POINT('+pt[1]+' '+pt[0]+')')
    +'&key='+encodeURIComponent(VWORLD_KEY)+'&domain='+encodeURIComponent(location.origin)+'&callback='+cb;
  document.head.appendChild(s);});}
// 다각형 면적(㎡) — 필지 크기라 평면 근사로 충분
function ringArea(r){if(r.length<3)return 0;const la0=r[0][0]*Math.PI/180,R=6371008.8,kx=R*Math.cos(la0)*Math.PI/180,ky=R*Math.PI/180;let a=0;
  for(let i=0,j=r.length-1;i<r.length;j=i++)a+=(r[j][1]*kx)*(r[i][0]*ky)-(r[i][1]*kx)*(r[j][0]*ky);return Math.abs(a/2);}
async function lotLookup(pt){
  if(!MP)return;
  const my=++lotSeq; lotClear(); lotLayer=MP.group();
  MP.dot(lotLayer,pt,{r:6,fill:'#d63031'});
  const ll=`<span class="lotll">${pt[0].toFixed(6)}, ${pt[1].toFixed(6)}</span>`;
  MP.popAt('<b>📍 주소 찾는 중…</b><br>'+ll,pt);
  const [ka,vw]=await Promise.all([kkAddr(pt),vwLot(pt).then(f=>({f}),e=>({err:e.message||String(e)}))]);
  if(my!==lotSeq||!MP)return;
  const f=vw.f, P=f&&f.properties||{};
  let jibun=(ka&&ka.jibun)||P.addr||'', jimok='', area=0;
  if(P.jibun){const m=String(P.jibun).match(/([가-힣]+)\s*$/);if(m)jimok=JIMOK[m[1]]||m[1];}
  if(f&&f.geometry){
    const g=f.geometry, polys=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];
    polys.forEach(pl=>{const rings=pl.map(r=>r.map(c=>[c[1],c[0]]));
      MP.poly(lotLayer,rings,{color:'#ff3b30',weight:3,fill:'#ff3b30',fillOp:.18});
      area+=ringArea(rings[0])-rings.slice(1).reduce((a,r)=>a+ringArea(r),0);});
  }
  LOT={jibun,road:ka&&ka.road||'',pt,pnu:P.pnu||''};
  let h='';
  if(jibun)h+=`<b class="lotj">${esc(jibun)}</b>`;else h+='<b>주소를 찾지 못했어요</b>';
  if(ka&&ka.road)h+=`<div class="lotr">도로명 ${esc(ka.road)}</div>`;
  if(jimok||area)h+=`<div class="lotm">${jimok?'지목 <b>'+esc(jimok)+'</b>':''}${jimok&&area?' · ':''}${area?'면적 약 <b>'+Math.round(area).toLocaleString()+'㎡</b> ('+Math.round(area/3.3058).toLocaleString()+'평)':''}</div>`;
  if(vw.err)h+=`<div class="lotw">필지 경계를 못 불러왔어요 (${esc(vw.err)})</div>`;
  else if(!f)h+='<div class="lotw">이 자리는 지적도 필지가 없어요</div>';
  h+=ll+(jibun?'<div class="lotb"><button type="button" data-lot="copy">📋 지번 복사</button><button type="button" class="b2" data-lot="clear">경계 지우기</button></div>':'<div class="lotb"><button type="button" class="b2" data-lot="clear">지우기</button></div>');
  MP.popAt(h,pt);
}

/* ---------- 철탑 위치 찍기 (위성 지도에서 직접 지정) ----------
   · 순시 [도착] 없이도 위성 사진을 보고 철탑 위치를 정함 → 2기 이상이면 3D가 실제 지형·위성 사진으로 바뀜
   · 손으로 찍은 위치는 gpsN=0 으로 저장해서, 나중에 현장 [도착] 기록이 들어오면 그 값으로 바뀜 */
let posMode=false, posLayer=null, posIdx=0;
function posTowers(){return cur().towers;}
function posFill(){
  const T_=posTowers(), sel=document.getElementById('posSel');
  sel.innerHTML=T_.map((d,i)=>`<option value="${i}">${NO(esc(d.label))}${d.gps?(d.gpsSrc==='map'?' 📌':' 📍'):''}</option>`).join('');
  sel.value=String(posIdx);
  const n=T_.filter(d=>d.gps).length, d=T_[posIdx];
  document.getElementById('posMsg').innerHTML=d?`<b>${NO(esc(d.label))}</b> ${d.gps?'위치가 있어요. 다시 누르면 옮겨져요.':'자리를 위성 지도에서 누르세요.'} · 위치 있는 철탑 <b>${n}/${T_.length}</b>기${n<2?' (2기 이상이면 3D가 실제 지형으로 바뀌어요)':''}`:'철탑이 없어요';
}
function posDraw(){
  if(!MP)return;
  MP.clear(posLayer); posLayer=MP.group();
  const T_=posTowers(), pts=[];
  T_.forEach((d,i)=>{
    if(!d.gps)return; pts.push(d.gps);
    const on=i===posIdx;
    MP.label(posLayer,d.gps,`<div class="tlab" style="${on?'background:#f5b301;color:#000;':''}${d.gpsSrc==='map'?'outline:2px dashed #f5b301;':''}">${NO(esc(d.label))}</div>`,{
      click:()=>{posIdx=i;posFill();posDraw();},
      drag:q=>{d.gps=[+q[0].toFixed(6),+q[1].toFixed(6)];d.gpsN=0;d.gpsSrc='map';posIdx=i;save();posFill();posDraw();}});
  });
  if(pts.length>1)MP.line(posLayer,pts,{color:'#f5b301',weight:2,opacity:.8,dash:true});
}
function posStart(){
  if(GP){alert('순시 기록 중에는 위치 찍기를 할 수 없어요.');return;}
  if(!MP)return;
  posMode=true; document.getElementById('mapPick').hidden=true; document.getElementById('posBar').hidden=false;
  MP.clear(mapLayer); mapLayer=null;
  const T_=posTowers(); const k=T_.findIndex(d=>!d.gps); posIdx=selT&&T_.indexOf(selT.d||selT)>=0?T_.indexOf(selT.d||selT):(k>=0?k:0);
  posFill(); posDraw();
  try{if(MP.zoom()<14){const g=T_.filter(d=>d.gps).map(d=>d.gps);if(g.length)MP.fit(g,17,.3);}}catch(e){}
}
function posStop(){
  posMode=false; document.getElementById('posBar').hidden=true;
  if(MP)MP.clear(posLayer); posLayer=null;
  openMap();
}
function posMove(dv){const n=posTowers().length;if(!n)return;posIdx=Math.max(0,Math.min(n-1,posIdx+dv));posFill();posDraw();const d=posTowers()[posIdx];if(d&&d.gps&&MP)MP.pan(d.gps);}
document.getElementById('mapPos').addEventListener('click',()=>{if(posMode)posStop();else posStart();});
document.getElementById('posEnd').addEventListener('click',posStop);
document.getElementById('posPrev').addEventListener('click',()=>posMove(-1));
document.getElementById('posNext').addEventListener('click',()=>posMove(1));
document.getElementById('posSel').addEventListener('change',e=>{posIdx=+e.target.value;posFill();posDraw();const d=posTowers()[posIdx];if(d&&d.gps&&MP)MP.pan(d.gps);});
document.getElementById('posDel').addEventListener('click',()=>{const d=posTowers()[posIdx];if(!d||!d.gps)return;if(!confirm(`${NO(d.label)} 위치를 지울까요?`))return;delete d.gps;delete d.gpsN;delete d.gpsSrc;save();posFill();posDraw();});
function posOnMapClick(pt){
  if(!posMode)return;
  const T_=posTowers(), d=T_[posIdx]; if(!d)return;
  d.gps=[+pt[0].toFixed(6),+pt[1].toFixed(6)]; d.gpsN=0; d.gpsSrc='map';
  save();
  // 다음 철탑으로 자동 이동 (위치 없는 철탑 우선)
  const nx=T_.findIndex((x,i)=>i>posIdx&&!x.gps); posIdx=nx>=0?nx:Math.min(T_.length-1,posIdx+1);
  posFill(); posDraw();
}

function pathAt(d){const P=pathInfo.pts,C=pathInfo.cum;let i=0;while(i<C.length-2&&C[i+1]<d)i++;const span=(C[i+1]-C[i])||1,u=Math.min(1,Math.max(0,(d-C[i])/span));return {p:new T.Vector3().lerpVectors(P[i],P[i+1],u),h:pathInfo.dirs[i]};}
function pathY_old(x){const P=pathInfo.pts,f=(x-pathInfo.x0)/20,i=Math.max(0,Math.min(P.length-2,Math.floor(f))),u=Math.min(1,Math.max(0,f-i));return P[i].y+(P[i+1].y-P[i].y)*u;}

async function pushAll(){
  if(!canEdit()){say(RO_MSG);return;}
  if(!isAdmin()){say('서버 전체 덮어쓰기는 관리자만 할 수 있어요');return;}
  clearTimeout(flushT); flushT=null;
  while(flushing) await new Promise(ok=>setTimeout(ok,200));
  const now={}; lines.forEach(l=>now[l.id]=JSON.stringify(l));
  const up=lines.map(l=>({id:l.id,data:JSON.parse(now[l.id]),updated_by:CLIENT}));
  const {data,error}=await sb.from(T_LINES).upsert(up).select('id,updated_at'); if(error) throw error;
  up.forEach(x=>serverHash[x.id]=now[x.id]); (data||[]).forEach(x=>serverStamp[x.id]=x.updated_at);

function lot3Hit(cx,cy){
  if(!G||!G.toLL)return null;
  const r=renderer.domElement.getBoundingClientRect();
  lot3V.set((cx-r.left)/r.width*2-1,-(cy-r.top)/r.height*2+1);
  lot3Ray.setFromCamera(lot3V,camera);
  const o=lot3Ray.ray.origin, d=lot3Ray.ray.direction, H=(x,z)=>terrH(x,z);
  if(o.y<H(o.x,o.z))return null;
  let a=0, step=4, t=0;
  for(let k=0;k<20000&&t<120000;k++){
    t=a+step; const x=o.x+d.x*t, y=o.y+d.y*t, z=o.z+d.z*t;
    if(y<=H(x,z)){let lo=a,hi=t;for(let j=0;j<30;j++){const m=(lo+hi)/2;if(o.y+d.y*m<=H(o.x+d.x*m,o.z+d.z*m))hi=m;else lo=m;}
      const x2=o.x+d.x*hi, z2=o.z+d.z*hi; return {x:x2,z:z2};}

  }

}

function lot3From(){

  const a=px[0]-p0[0], b=pz[0]-p0[0], c=px[1]-p0[1], dd=pz[1]-p0[1], det=a*dd-b*c;
  return (lat,lng)=>{const u=lat-p0[0], v=lng-p0[1];return [(dd*u-b*v)/det,(-c*u+a*v)/det];};
}

  const W=t.w,H=t.h,D=t.ctx.getImageData(0,0,W,H).data;
  const hp=(i,j)=>{i=Math.max(0,Math.min(W-1,i));j=Math.max(0,Math.min(H-1,j));const o=(j*W+i)*4;return D[o+3]<250?NaN:D[o]*256+D[o+1]+D[o+2]/256-32768;};

const lbImg=gid('lbImg'), LBZ={s:1,x:0,y:0,P:new Map(),d0:0,s0:1,c0:null,x0:0,y0:0,moved:false,tap:0};
const lbApply=()=>{lbImg.style.transform=`translate(${LBZ.x}px,${LBZ.y}px) scale(${LBZ.s})`;gid('lbH').style.display=LBZ.s>1.01?'none':'';};
const lbReset=()=>{LBZ.s=1;LBZ.x=0;LBZ.y=0;lbImg.style.transition='transform .2s';lbApply();setTimeout(()=>lbImg.style.transition='',220);};
function lbClamp(){const r=lbImg.getBoundingClientRect(),W=innerWidth,H=innerHeight,bw=r.width,bh=r.height,ox=r.left-LBZ.x,oy=r.top-LBZ.y;   // 사진이 화면 밖으로 다 나가지 않게
  if(bw<=W)LBZ.x=(W-bw)/2-ox;else LBZ.x=Math.min(-ox,Math.max(W-bw-ox,LBZ.x));
  if(bh<=H)LBZ.y=(H-bh)/2-oy;else LBZ.y=Math.min(-oy,Math.max(H-bh-oy,LBZ.y));}
function lbZoomAt(ns,cx,cy){ns=Math.max(1,Math.min(8,ns));const r=lbImg.getBoundingClientRect(),ox=r.left-LBZ.x,oy=r.top-LBZ.y,px=(cx-ox-LBZ.x)/LBZ.s,py=(cy-oy-LBZ.y)/LBZ.s;
  LBZ.s=ns;LBZ.x=cx-ox-px*ns;LBZ.y=cy-oy-py*ns;if(ns<=1.001){LBZ.s=1;LBZ.x=0;LBZ.y=0;}else lbClamp();lbApply();}
const zoom=src=>{lbImg.src=src;LBZ.s=1;LBZ.x=0;LBZ.y=0;lbApply();lbEl.hidden=false;};
function lbClose(){lbEl.hidden=true;lbImg.src='';LBZ.P.clear();}
gid('lbX').addEventListener('click',e=>{e.stopPropagation();lbClose();});
lbEl.addEventListener('pointerdown',e=>{if(e.target.id==='lbX')return;lbEl.setPointerCapture(e.pointerId);LBZ.P.set(e.pointerId,{x:e.clientX,y:e.clientY});LBZ.moved=false;
  if(LBZ.P.size===2){const[a,b]=[...LBZ.P.values()];LBZ.d0=Math.hypot(a.x-b.x,a.y-b.y);LBZ.s0=LBZ.s;LBZ.c0={x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
  else if(LBZ.P.size===1){LBZ.c0={x:e.clientX,y:e.clientY};LBZ.x0=LBZ.x;LBZ.y0=LBZ.y;}});
lbEl.addEventListener('pointermove',e=>{if(!LBZ.P.has(e.pointerId))return;LBZ.P.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(LBZ.P.size>=2){const[a,b]=[...LBZ.P.values()],d=Math.hypot(a.x-b.x,a.y-b.y),c={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    if(LBZ.d0>0){lbZoomAt(LBZ.s0*d/LBZ.d0,c.x,c.y);LBZ.s0=LBZ.s;LBZ.d0=d;if(LBZ.s>1){LBZ.x+=c.x-LBZ.c0.x;LBZ.y+=c.y-LBZ.c0.y;lbClamp();lbApply();}}LBZ.c0=c;LBZ.moved=true;}
  else if(LBZ.P.size===1&&LBZ.c0){const dx=e.clientX-LBZ.c0.x,dy=e.clientY-LBZ.c0.y;if(Math.hypot(dx,dy)>6)LBZ.moved=true;if(LBZ.s>1&&LBZ.moved){LBZ.x=LBZ.x0+dx;LBZ.y=LBZ.y0+dy;lbClamp();lbApply();}}});
const lbUp=e=>{if(!LBZ.P.has(e.pointerId))return;const wasOne=LBZ.P.size===1;LBZ.P.delete(e.pointerId);
  if(LBZ.P.size===1){const p=[...LBZ.P.values()][0];LBZ.c0={x:p.x,y:p.y};LBZ.x0=LBZ.x;LBZ.y0=LBZ.y;return;}
  if(!wasOne||LBZ.moved)return;
  const now=Date.now();
  if(now-LBZ.tap<300){LBZ.tap=0;clearTimeout(LBZ.tt);if(LBZ.s>1.01)lbReset();else{lbImg.style.transition='transform .2s';lbZoomAt(2.5,e.clientX,e.clientY);setTimeout(()=>lbImg.style.transition='',220);}return;}
  LBZ.tap=now;clearTimeout(LBZ.tt);LBZ.tt=setTimeout(()=>{if(LBZ.s<=1.01&&e.target!==lbImg)lbClose();},310);};   // 확대 안 한 상태에서 사진 바깥을 한 번 누르면 닫기
lbEl.addEventListener('pointerup',lbUp);lbEl.addEventListener('pointercancel',e=>LBZ.P.delete(e.pointerId));

    const supCut=([s,n])=>{if(g.optSides!==SUP)return [[s,n]];const no=s.includes('2_')?'2':'1',r=+t.d['supR'+no]||0,pos=s.replace(/^sup_(2_)?/,''),has2=photosOf(tid,g.id+'_'+s).length>0;

async function shrink(file){
  try{
    const bmp=await createImageBitmap(file);
    const s=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);
    cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(r,'image/jpeg',.8))||file;
  }catch(e){return file;}
}
async function addPhoto(f){
  if(!canEdit()){say(RO_MSG);return;}
  let files=[...(f.files||[])].filter(x=>!x.type||x.type.startsWith('image/'));
  const job=pending; f.value='';
  if(!files.length||!job) return;
  if(!job.multi) files=files.slice(0,1);
  const old=job.multi?[]:photosOf(job.tid,job.slot.id);
  say('사진을 저장하는 중…',true);
  let step='사진 줄이기';
  try{
    let n=0;
    let q=0;
    for(const file of files){
      step='사진 줄이기'; const blob=await shrink(file);
      const pid='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
      const path=job.tid+'/'+pid+'.jpg';
      step='사진 올리기';
      const r=await putPhoto({pid,path,blob,tid:job.tid,lineId:job.lineId,slot:job.slot.id,name:file.name||'',at:Date.now()+n+q,replace:!job.multi});
      if(r==='queued')q++; else n++;
    }
    if(n){for(const p of old){if(p.pending)continue;try{await deletePhoto(p,true);}catch(e){console.warn(e);}}await pullPhotos(true);}
    if(q){renderLedger();say(`📵 전화가 안 터져서 사진 ${q}장을 휴대폰에 보관했어요 · 연결되면 자동으로 올려요`,true);}
    else say(n>1?n+'장을 저장했어요.':'사진을 저장했어요.');
  }catch(e){
    console.error(e);
    const m=((e&&(e.message||e.error))||String(e));
    const hint=/row-level|policy|permission|Unauthorized|403|42501/i.test(m)?' → Supabase에서 SQL을 다시 실행하세요.':/bucket/i.test(m)?' → 사진 보관함이 없어요. SQL을 다시 실행하세요.':/fetch|network/i.test(m)?' → 인터넷 연결을 확인하세요.':'';
    say(`저장 실패 (${step}): ${m}${hint}`,true);
  }
}

/* ---------- v21.23 사진 보관함: 전화가 안 될 때 찍은 사진을 휴대폰(IndexedDB)에 두었다가 연결되면 자동으로 올림 ---------- */
let PQDB=null, pqBusy=false;
function pqDb(){return PQDB||(PQDB=new Promise((res,rej)=>{const r=indexedDB.open('tower3d-pq',1);r.onupgradeneeded=()=>r.result.createObjectStore('q',{keyPath:'pid'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}));}
async function pqAdd(it){const db=await pqDb();await new Promise((res,rej)=>{const tx=db.transaction('q','readwrite');tx.objectStore('q').put(it);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}
async function pqAll(){const db=await pqDb();return new Promise((res,rej)=>{const r=db.transaction('q').objectStore('q').getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});}
async function pqDel(pid){const db=await pqDb();await new Promise((res,rej)=>{const tx=db.transaction('q','readwrite');tx.objectStore('q').delete(pid);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});}
async function pqLoad(){
  let all=[];try{all=await pqAll();}catch(e){}
  PQ_LIST=all.map(it=>{const path='pending:'+it.pid;if(!urlCache[path])try{urlCache[path]=URL.createObjectURL(it.blob);}catch(e){}
    return {id:it.pid,towerId:it.tid,lineId:it.lineId,slot:it.slot,path,name:it.name,at:it.at,pending:true};});
  pqPaint();
}
function pqPaint(){
  const n=PQ_LIST.length;let b=document.getElementById('pqBadge');
  if(!n){if(b)b.remove();return;}
  if(!b){b=document.createElement('button');b.id='pqBadge';b.type='button';b.className='btn';b.style.cssText='background:#c98a00;color:#fff;border-color:#c98a00';
    b.onclick=()=>{if(!cloudReady||navigator.onLine===false)say('📵 아직 연결이 안 돼요 · 연결되면 자동으로 올려요');else pqRun();};
    const z=gid('xlsBtn');if(z&&z.parentNode)z.parentNode.insertBefore(b,z);else document.body.appendChild(b);}
  b.textContent='📵 사진 대기 '+n+'장';
}
const netErr=e=>navigator.onLine===false||/fetch|network|Load failed|timeout|Failed/i.test(String((e&&(e.message||e.error))||e));
async function putPhoto(it){   // 올리기 → 연결이 안 되면 보관함으로. 'up' | 'queued'
  if(AS&&cloudReady&&navigator.onLine!==false){
    let up;try{up=await sb.storage.from(BUCKET).upload(it.path,it.blob,{contentType:'image/jpeg',upsert:true});}catch(e){up={error:e};}
    if(!up.error){
      let ins;try{ins=await sb.from(T_PHOTOS).insert({id:it.pid,data:{towerId:it.tid,lineId:it.lineId,slot:it.slot,path:it.path,name:it.name,at:it.at}});}catch(e){ins={error:e};}
      if(!ins.error)return 'up';
      if(!netErr(ins.error))throw ins.error;
    }else if(!netErr(up.error))throw up.error;
  }
  await pqAdd(it); await pqLoad(); return 'queued';
}
async function pqRun(){
  if(pqBusy||!cloudReady||!sb||!canEdit()||navigator.onLine===false){pqPaint();return;}
  let all=[];try{all=await pqAll();}catch(e){return;}
  if(!all.length){pqLoad();return;}
  pqBusy=true;let ok=0;
  try{
    for(const it of all.sort((a,b)=>a.at-b.at)){
      const up=await sb.storage.from(BUCKET).upload(it.path,it.blob,{contentType:'image/jpeg',upsert:true}); if(up.error)throw up.error;
      const ins=await sb.from(T_PHOTOS).upsert({id:it.pid,data:{towerId:it.tid,lineId:it.lineId,slot:it.slot,path:it.path,name:it.name,at:it.at}}); if(ins.error)throw ins.error;
      if(it.replace){await pullPhotos(true);for(const p of photos.filter(p=>p.towerId===it.tid&&p.slot===it.slot&&p.id!==it.pid&&(p.at||0)<it.at)){try{await deletePhoto(p,true);}catch(e){console.warn(e);}}}
      await pqDel(it.pid); ok++;
    }
  }catch(e){console.warn(e);}finally{pqBusy=false;}
  await pqLoad();
  if(ok){await pullPhotos(true);if(!ledgerEl.hidden)renderLedger();say('📶 보관해 둔 사진 '+ok+'장을 올렸어요.');}
}
setInterval(()=>{if(cloudReady&&navigator.onLine!==false&&PQ_LIST.length)pqRun();},30000);
async function deletePhoto(p,noPull){
  if(!canEdit()){say(RO_MSG);return;}
  if(p.pending){await pqDel(p.id);await pqLoad();if(!ledgerEl.hidden)renderLedger();return;}
  const {error}=await sb.from(T_PHOTOS).delete().eq('id',p.id); if(error) throw error;
  try{await sb.storage.from(BUCKET).remove([p.path]);}catch(e){console.warn(e);}
  if(!noPull) await pullPhotos(true);
}
async function dropPhotos(towerIds){

}

function seqOrder(t){

  add('num_plate','번호찰');

  [['1',''],['2','2_']].forEach(([no,p])=>[['src','전원측'],['load','부하측']].forEach(([sd,sn])=>
    [['d','하단'],['m','중단'],['u','상단']].forEach(([tr,tn])=>add('insulator_'+(tr==='u'?'':tr+'_')+p+sd,`애자련 #${no} ${sn} ${tn}`))));
  if(lineHas(l,'OPGW')) [['src','전원측'],['mid','중앙'],['load','부하측']].forEach(([s,n])=>add('opgw_'+s,'OPGW '+n));
  if(lineHas(l,'GW')) [['src','전원측'],['mid','중앙'],['load','부하측']].forEach(([s,n])=>add('gw_'+s,'GW '+n));
  // v21.32: 전경 4면 — 기본은 꺼짐(휴대폰 사진 시간순 채우기엔 안 씀) · 드론 기별촬영 사진은 이름으로 들어감
  [['src','전원측'],['s1','#1측'],['load','부하측'],['s2','#2측']].forEach(([k,n])=>add('view_'+k,'전경 '+n,false));
  let off={}; try{off=JSON.parse(lsGet('tower3d-seq-off')||'{}')||{};}catch(e){}
  r.forEach(x=>{if(x.id in off) x.on=!off[x.id];});
  return r;
}

const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

function makeZip(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  const n=new Date(),dt=((n.getFullYear()-1980)<<9)|((n.getMonth()+1)<<5)|n.getDate(),tm=(n.getHours()<<11)|(n.getMinutes()<<5)|(n.getSeconds()>>1);
  for(const f of files){
    const nm=enc.encode(f.name),crc=crc32(f.data),sz=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);
    parts.push(lh.buffer,nm,f.data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cen.push(ch.buffer,nm);
    off+=30+nm.length+sz;
  }
  let cs=0;cen.forEach(b=>cs+=b.byteLength);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cen,end.buffer],{type:'application/zip'});
}

      else if(!first)say('📶 연결됐어요 · 서버와 맞췄어요');
      lsSet('tower3d-mig','1');
      gid('zipBtn').hidden=false;
      await pullPhotos(true);
      syncState('ok','저장됨 · 공유 중');
      if(!after)afterConnect();
      first=false; pqRun(); if(!ledgerEl.hidden)renderLedger();
      return true;
    }catch(e){
      console.error(e);
      const msg=String((e&&e.message)||e)+' '+((e&&e.code)||'');
      if(/tower3d_|relation|schema cache|42P01|PGRST205/i.test(msg)) syncState('err','서버 준비 안 됨 · SQL을 먼저 실행하세요');
      else if(/permission|policy|42501|401|403/i.test(msg)) syncState('err','서버 권한 없음 · SQL을 다시 실행하세요');
      else syncState('err','📵 연결 안 됨 · 휴대폰에 저장된 자료로 보는 중 (연결되면 자동으로 맞춤)');
      return false;
    }finally{connecting=false;}
  }
  function afterConnect(){
    after=true;
    setInterval(()=>{if(document.visibilityState==='visible') pull();},10000);
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible') pull();});
    window.addEventListener('online',()=>{flush();pull();pqRun();});
  }
  if(!await connect()){
    if(first&&hasGpsLine()&&!ALL)openAll(true);
    first=false;
    window.addEventListener('online',()=>{if(!cloudReady)connect();});
    const iv=setInterval(()=>{if(cloudReady){clearInterval(iv);return;}if(navigator.onLine!==false)connect();},20000);
  }
})();
// v21.17: 순시 지도를 누르기 전에 카카오 지도 프로그램을 미리 받아 둬서 바로 열리게

if('serviceWorker' in navigator){

/* ---------- 루프 ---------- */
const v=new T.Vector3(); let last=performance.now();
function show(el,on){if(el._on!==on){el._on=on;el.style.visibility=on?'visible':'hidden';}}
function proj(x,y,z,w,h){v.set(x,y,z).project(camera);if(!(v.z<1&&v.x>-1.1&&v.x<1.1&&v.y>-1.1&&v.y<1.1))return null;return [Math.round((v.x+1)/2*w),Math.round((1-v.y)/2*h)];}
function put(el,p,dy){el.style.transform=`translate3d(${p[0]}px,${p[1]+(dy||0)}px,0) translate(-50%,-100%)`;}
// v21.41: 화면이 멈춰 있을 땐 그리기를 줄여 버벅임·발열을 줄임 (움직이거나 만지면 바로 60프레임)
let busyT=performance.now(), lastDraw=0, lastTags=0; const camSig=[0,0,0,0,0,0,0];
const kick=()=>{busyT=performance.now();};
['pointerdown','pointermove','wheel','touchstart','touchmove','keydown'].forEach(ev=>window.addEventListener(ev,kick,{passive:true}));
window.addEventListener('resize',kick);
function camMoved(){const p=camera.position,q=camera.quaternion,a=[p.x,p.y,p.z,q.x,q.y,q.z,q.w];let m=false;for(let i=0;i<7;i++){if(Math.abs(a[i]-camSig[i])>(i<3?0.01:1e-5))m=true;camSig[i]=a[i];}return m;}
function loop(now){
  if(!ledgerEl.hidden){last=now;requestAnimationFrame(loop);return;}
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(anim||play) busyT=now;
  if(now-busyT>900){   // 멈춰 있음: 4번/초만 그림 (깜빡이는 항공장애등이 있으면 10번/초)
    if(now-lastDraw<(strobes.length?100:250)){requestAnimationFrame(loop);return;}
  }
  lastDraw=now;
  if(anim){
    const u=Math.min(1,(now-anim.start)/anim.dur), e=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
    camera.position.lerpVectors(anim.p0,anim.p1,e); controls.target.lerpVectors(anim.t0,anim.t1,e);
    if(u>=1) anim=null;
  }
  if(play){
    if(!play.paused&&!play.done){play.d+=150*SPEEDS[speedIx]*dt;if(play.d>=pathInfo.total){play.d=pathInfo.total;play.done=true;pPlay.textContent='↺';}}
    const pa=pathAt(play.d), pp=pa.p, ax=Math.cos(pa.h), az=Math.sin(pa.h), sx2=-az, sz2=ax;
    walker.visible=true; walker.position.set(pp.x,pp.y+6,pp.z);
    if(!play.paused){
      const k=1-Math.exp(-dt*2.5);
      controls.target.lerp(v.set(pp.x+ax*120-sx2*60,pp.y,pp.z+az*120-sz2*60),k);
      camera.position.lerp(v.set(pp.x-ax*520+sx2*460,pp.y+260,pp.z-az*520+sz2*460),k);
    }
    let c=-1; towers.forEach((t,i)=>{if(play.d>=pathInfo.towerS[i]-10)c=i;});
    if(c!==play.cur){
      play.cur=c; const t=c>=0?towers[c]:null, old=selT; selT=t;
      if(old) updateTag(old);
      if(t){updateTag(t);towers.forEach(z=>z.chip&&z.chip.classList.toggle('on',z===t));if(t.chip)chipsEl.scrollLeft=t.chip.offsetLeft-chipsEl.clientWidth/2;}
      updateMarker(); if(t) renderCard();
    }
    const fromN=play.cur>=0?H_(towers[play.cur]):'시점', toN=play.cur<towers.length-1?H_(towers[play.cur+1]):'종점';
    const cx=play.cur>=0&&play.cur<towers.length-1?crossOf(towers[play.cur].d):[];
    pText.innerHTML=`${play.done?'종점 도착':esc(fromN)+' → '+esc(toN)}${cx.map(c=>' · '+c.name).join('')} <span>${(play.d/1000).toFixed(2)} / ${(pathInfo.total/1000).toFixed(2)} km</span>`;
    pBar.style.width=(play.d/pathInfo.total*100)+'%';
  }
  if(strobes.length){const hi=reduceMotion||(now%1000)<140, mid=reduceMotion||(now%1500)<750;const low=reduceMotion||(now%2000)<1000;strobes.forEach(s=>{const on=s.kind==='high'?hi:s.kind==='mid'?mid:low;s.m.visible=on;s.glow.visible=on;});}
  controls.update(); if(camMoved()) busyT=now; renderer.render(scene,camera);
  const idle=now-busyT>900;
  if(showTags&&(!idle||now-lastTags>500)){lastTags=now;
    const w=host.clientWidth,h=host.clientHeight;
    // v20.9: 번호표가 화면에서 서로 겹치면 가까운 철탑 것만 보여 줌 (선택한 철탑은 항상)
    const GR=90, grid=new Map(), pad=3;
    const sz=el=>{if(!el._w){el._w=el.offsetWidth||60;el._h=el.offsetHeight||24;}return [el._w,el._h];};
    const free=(x0,y0,x1,y1)=>{for(let gx=Math.floor(x0/GR);gx<=Math.floor(x1/GR);gx++)for(let gy=Math.floor(y0/GR);gy<=Math.floor(y1/GR);gy++){const L=grid.get(gx+','+gy);if(L)for(const r of L)if(x0<r[2]&&x1>r[0]&&y0<r[3]&&y1>r[1])return false;}return true;};
    const take=(x0,y0,x1,y1)=>{const r=[x0,y0,x1,y1];for(let gx=Math.floor(x0/GR);gx<=Math.floor(x1/GR);gx++)for(let gy=Math.floor(y0/GR);gy<=Math.floor(y1/GR);gy++){const k=gx+','+gy;if(!grid.has(k))grid.set(k,[]);grid.get(k).push(r);}};
    const place=(el,p,dy,force)=>{const [ew,eh]=sz(el),x0=p[0]-ew/2-pad,x1=p[0]+ew/2+pad,y1=p[1]+(dy||0)+pad,y0=y1-eh-2*pad;
      if(!force&&!free(x0,y0,x1,y1)){show(el,false);return false;}take(x0,y0,x1,y1);show(el,true);put(el,p,dy);return true;};
    const hideT=t=>{show(t.tag,false);if(t.landTag)show(t.landTag,false);if(t.kudzuTag)show(t.kudzuTag,false);if(t.slopeTag)show(t.slopeTag,false);if(t.lowTag)show(t.lowTag,false);};
    // 선택한 철탑 → (전체 선로 보기면 선로 이름) → 가까운 철탑 순
    if(selT&&selT.tag){const p=proj(selT.x,selT.y+selT.H+8,selT.z,w,h);if(p)place(selT.tag,p,0,true);else hideT(selT);}
    // v20.28: 산에 가려진 철탑 번호표는 숨김 · 전체 선로에선 가까이 볼 때 보고 있는 선로만
    const nowT=performance.now();
    if(!loop._t||nowT-loop._t>250){loop._t=nowT;
      const C=camera.position;
      towers.forEach(t=>{t._occ=G&&G.terr?occluded(C,t.x,t.y+t.H+4,t.z):false;});
      spans.forEach(s=>{s._occ=ALL&&G&&G.terr?occluded(C,s.x,s.y-8,s.z):false;});
      FOCUS=null;
      if(ALL&&camera.position.distanceTo(controls.target)<6000){let bd=1e18;
        towers.forEach(t=>{const dx=t.x-controls.target.x,dz=t.z-controls.target.z,d=dx*dx+dz*dz;if(d<bd){bd=d;FOCUS=t.line;}});}
    }
    const onFocus=t=>!FOCUS||t.line===FOCUS||(t.share&&t.share.some(s=>s.line===FOCUS));
    if(ALL)spans.forEach(s=>{const p=proj(s.x,s.y-8,s.z,w,h);const lineOf=s.line;
      s.tags.forEach((el,k)=>{if(!p||s._occ||(FOCUS&&lineOf&&lineOf!==FOCUS))show(el,false);else place(el,p,k*24);});});
    const cand=[];
    towers.forEach(t=>{if(t===selT)return;if(t._occ||(ALL&&!onFocus(t))){hideT(t);return;}const p=proj(t.x,t.y+t.H+8,t.z,w,h);if(!p){hideT(t);return;}
      const dx=t.x-camera.position.x,dy=t.y-camera.position.y,dz=t.z-camera.position.z;cand.push([dx*dx+dy*dy+dz*dz,t,p]);});
    cand.sort((a,b)=>a[0]-b[0]);
    cand.forEach(([d2,t,p])=>{
      if(ALL){const near=d2<1600*1600?1:0;if(t._near!==near){t._near=near;t.tag.innerHTML=allTagHTML(t,near);t.tag._w=0;}}
      if(!place(t.tag,p,0)){hideT(t);return;}
      if(t.landTag||t.kudzuTag||t.slopeTag||t.lowTag){const g=proj(t.x,t.y,t.z,w,h);let dy=26;
        [t.landTag,t.kudzuTag,t.slopeTag,t.lowTag].forEach(el=>{if(!el)return;if(g){show(el,true);put(el,g,dy);dy+=22;}else show(el,false);});}
    });
    if(!ALL)spans.forEach(s=>{
      const p=s.tags.length?proj(s.x,s.y-8,s.z,w,h):null;
      s.tags.forEach((el,k)=>{if(!p)show(el,false);else{show(el,true);put(el,p,k*24);}});
    });
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
